/* ================= DAY SCREEN ================= */
function dayStageList(){
  const when = state.settings.timers.balaganWhen;
  if(when==='before_circle') return ['balagan','speeches','announce','defense','vote','result'];
  if(when==='before_defense') return ['speeches','announce','balagan','defense','vote','result'];
  return ['speeches','announce','defense','balagan','vote','result']; // after_defense
}

function computeSpeechOrder(){
  const s = state.settings;
  const g = state.game;
  const n = s.playerCount;
  const startNum = ((g.round - 1) % n) + 1;
  const order = [];
  for(let i=0;i<n;i++){
    let num;
    if(s.direction==='ccw'){
      num = ((startNum - 1 - i) % n + n) % n + 1;
    } else {
      num = ((startNum - 1 + i) % n) + 1;
    }
    order.push(num);
  }
  return order.filter(num=>{
    const p = g.players.find(pl=>pl.number===num);
    return p && p.alive;
  });
}

function beginDay(){
  const g = state.game;
  g.day = {
    stageList: dayStageList(),
    stageIdx: 0,
    speechOrder: computeSpeechOrder(),
    speechIndex: 0,
    nominees: [],
    defenseIndex: 0,
    nominateSelection: null,
    voteIndex: 0,
  };
  state.screen = 'day';
  g.screen = 'day';
  saveGame();
  render();
}

function dayAdvanceStage(){
  const g = state.game;
  g.day.stageIdx++;
  saveGame();
  render();
}

let timerHandle = null;
function stopTimer(){ if(timerHandle){ clearInterval(timerHandle); timerHandle=null; } }

function renderTimerBlock(container, seconds, onDone, label){
  let remaining = seconds;
  let running = false;
  const wrap = el(`<div></div>`);
  wrap.appendChild(el(`<div class="muted" style="text-align:center;">${label||''}</div>`));
  const disp = el(`<div class="timer-display">${remaining}</div>`);
  wrap.appendChild(disp);
  const controls = el(`<div class="row" style="justify-content:center; gap:8px;"></div>`);
  const startBtn = el(`<button class="small">▶ Старт</button>`);
  const pauseBtn = el(`<button class="small ghost">⏸ Пауза</button>`);
  const plusBtn = el(`<button class="small ghost">+10 сек</button>`);
  const resetBtn = el(`<button class="small ghost">↻ Скинути</button>`);
  controls.appendChild(startBtn); controls.appendChild(pauseBtn); controls.appendChild(plusBtn); controls.appendChild(resetBtn);
  wrap.appendChild(controls);
  container.appendChild(wrap);

  function setRunning(r){
    running = r;
    startBtn.classList.toggle('timer-btn-active', running);
    pauseBtn.classList.toggle('timer-btn-active', !running);
  }
  function flash(btn){
    btn.classList.add('timer-btn-active');
    setTimeout(()=>btn.classList.remove('timer-btn-active'), 220);
  }
  setRunning(false);

  function tick(){
    remaining--;
    disp.textContent = remaining;
    if(remaining<=5) disp.classList.add('warn'); else disp.classList.remove('warn');
    if(remaining<=0){ stopTimer(); setRunning(false); try{ navigator.vibrate && navigator.vibrate([120,60,120]); }catch(e){} if(onDone) onDone(); }
  }
  startBtn.addEventListener('click', ()=>{ stopTimer(); timerHandle=setInterval(tick,1000); setRunning(true); });
  pauseBtn.addEventListener('click', ()=>{ stopTimer(); setRunning(false); });
  plusBtn.addEventListener('click', ()=>{ remaining+=10; disp.textContent=remaining; disp.classList.remove('warn'); flash(plusBtn); });
  resetBtn.addEventListener('click', ()=>{ stopTimer(); setRunning(false); remaining=seconds; disp.textContent=remaining; disp.classList.remove('warn'); });
  return wrap;
}

function renderDay(root, nav){
  const g = state.game;
  let day = g.day;
  const timers = state.settings.timers;

  const KNOWN_DAY_STAGES = ['speeches','announce','balagan','defense','vote','result'];
  const curStage = (day && Array.isArray(day.stageList)) ? day.stageList[day.stageIdx] : undefined;
  if(!curStage || !KNOWN_DAY_STAGES.includes(curStage)){
    // stale or missing day state from an older version — rebuild safely
    if(!day){ beginDay(); return; }
    const keepNominees = Array.isArray(day.nominees) ? day.nominees : [];
    const keepOrder = Array.isArray(day.speechOrder) ? day.speechOrder : computeSpeechOrder();
    g.day = {
      stageList: dayStageList(),
      stageIdx: 0,
      speechOrder: keepOrder,
      speechIndex: 0,
      nominees: keepNominees,
      defenseIndex: 0,
      speechHistory: [],
      voteIndex: 0,
      nominateSelection: null,
    };
    saveGame();
    render();
    return;
  }
  const stage = day.stageList[day.stageIdx];
  root.appendChild(el(`<div class="tag" style="margin-bottom:8px; display:inline-block;">День ${g.round}</div>`));
  renderInlineNotes(root);

  if(stage==='speeches'){
    const num = day.speechOrder[day.speechIndex];
    const isLast = day.speechIndex >= day.speechOrder.length-1;
    root.appendChild(el(`<div class="night-banner">Слово надається гравцю №${num}. <span class="muted">(${day.speechIndex+1} з ${day.speechOrder.length})</span></div>`));
    const card = el(`<div class="card"></div>`);
    renderTimerBlock(card, timers.speech, ()=>{}, `Промова №${num} · ${timers.speech} сек`);
    root.appendChild(card);

    {
      const pickCard = el(`<div class="card"></div>`);
      pickCard.appendChild(el(`<div class="muted" style="margin-bottom:6px;">Запитай гравця №${num}: чи хоче він когось виставити на голосування? (необов'язково)</div>`));
      const grid = el(`<div class="player-grid"></div>`);
      day.nominateSelection = day.nominateSelection===undefined ? null : day.nominateSelection;
      g.players.forEach(p=>{
        const immune = hasImmunity(p.number);
        const eligible = p.alive && p.number!==num && !immune;
        const isSpeaker = p.number===num;
        const isNominated = day.nominees.includes(p.number);
        const cls = [
          !p.alive ? 'dead' : '',
          immune ? 'immune' : '',
          day.nominateSelection===p.number ? 'selected' : '',
          (isSpeaker && day.nominateSelection!==p.number) ? 'speaker-now' : '',
          (isNominated && day.nominateSelection!==p.number && !isSpeaker) ? 'already-nominated' : '',
        ].join(' ');
        const btn = el(`<button class="player-btn ${cls}" ${roleColor(p.roleId)?`style="background:${roleColor(p.roleId)}; border-color:${roleColor(p.roleId)};"`:''}>${p.number}</button>`);
        if(!eligible) btn.disabled = true;
        btn.addEventListener('click', ()=>{
          if(!eligible) return;
          day.nominateSelection = (day.nominateSelection===p.number) ? null : p.number;
          render();
        });
        grid.appendChild(btn);
      });
      pickCard.appendChild(grid);
      root.appendChild(pickCard);
      if(day.nominees.length>0){
        root.appendChild(el(`<div class="muted">На голосуванні наразі: ${day.nominees.map(n=>'№'+n).join(', ')}</div>`));
      } else {
        root.appendChild(el(`<div class="muted">Наразі ще нікого не виставили на голосування.</div>`));
      }
      if(g.immunePlayer!=null && g.round<=2){
        root.appendChild(el(`<div class="muted">🛡 Гравець №${g.immunePlayer} має імунітет — його не можна виставити на голосування.</div>`));
      }
    }

    const navWrap = el(`<div class="app-nav"></div>`);
    const backBtn = el(`<button class="ghost">Назад</button>`);
    backBtn.disabled = undoStack.length===0;
    backBtn.addEventListener('click', universalGoBack);
    const next = el(`<button class="primary">${isLast ? 'Далі' : 'Наступний гравець'}</button>`);
    next.addEventListener('click', ()=>{
      stopTimer();
      pushUndo();
      const target = day.nominateSelection;
      if(target!=null && !day.nominees.includes(target)) day.nominees.push(target);
      day.nominateSelection = null;
      if(!isLast){ day.speechIndex++; saveGame(); render(); }
      else { dayAdvanceStage(); }
    });
    navWrap.appendChild(backBtn);
    navWrap.appendChild(next);
    nav.appendChild(navWrap);
    return;
  }

  if(stage==='announce'){
    if(day.nominees.length===0){
      root.appendChild(el(`<div class="card"><h3>Голосування</h3><div class="theme-text">${g.round===1 ? 'Перший день — сьогодні нікого не виставляли на голосування.' : 'Сьогодні нікого не виставили на голосування.'}</div></div>`));
    } else {
      root.appendChild(el(`<div class="card"><h3>Голосування</h3><div class="theme-text">Скажи вголос: на голосування виставлені гравці під номерами ${day.nominees.map(n=>'№'+n).join(', ')}.</div></div>`));
    }
    const navWrap = el(`<div class="app-nav"></div>`);
    const backBtn = el(`<button class="ghost">Назад</button>`);
    backBtn.disabled = undoStack.length===0;
    backBtn.addEventListener('click', universalGoBack);
    const next = el(`<button class="primary">Далі</button>`);
    next.addEventListener('click', ()=>{ pushUndo(); dayAdvanceStage(); });
    navWrap.appendChild(backBtn);
    navWrap.appendChild(next);
    nav.appendChild(navWrap);
    return;
  }

  if(stage==='balagan'){
    root.appendChild(el(`<div class="night-banner"><b>Оголошується балаган!</b><br>Тепер усі можуть говорити одночасно й перебивати одне одного.</div>`));
    const card = el(`<div class="card"></div>`);
    renderTimerBlock(card, timers.balagan, ()=>{}, `Балаган · ${timers.balagan} сек`);
    root.appendChild(card);
    const navWrap = el(`<div class="app-nav"></div>`);
    const backBtn = el(`<button class="ghost">Назад</button>`);
    backBtn.disabled = undoStack.length===0;
    backBtn.addEventListener('click', universalGoBack);
    const next = el(`<button class="primary">Далі</button>`);
    next.addEventListener('click', ()=>{ stopTimer(); pushUndo(); dayAdvanceStage(); });
    navWrap.appendChild(backBtn);
    navWrap.appendChild(next);
    nav.appendChild(navWrap);
    return;
  }

  if(stage==='defense'){
    if(day.nominees.length===0){ dayAdvanceStage(); return; }
    const num = day.nominees[day.defenseIndex];
    root.appendChild(el(`<div class="night-banner">Гравець №${num} — виправдувальна промова.</div>`));
    const card = el(`<div class="card"></div>`);
    renderTimerBlock(card, timers.voteSpeech, ()=>{}, `№${num} · ${timers.voteSpeech} сек`);
    root.appendChild(card);
    const navWrap = el(`<div class="app-nav"></div>`);
    const backBtn = el(`<button class="ghost">Назад</button>`);
    backBtn.disabled = undoStack.length===0;
    backBtn.addEventListener('click', universalGoBack);
    const next = el(`<button class="primary">${day.defenseIndex < day.nominees.length-1 ? 'Наступний' : 'Далі'}</button>`);
    next.addEventListener('click', ()=>{
      stopTimer();
      pushUndo();
      if(day.defenseIndex < day.nominees.length-1){ day.defenseIndex++; saveGame(); render(); }
      else { dayAdvanceStage(); }
    });
    navWrap.appendChild(backBtn);
    navWrap.appendChild(next);
    nav.appendChild(navWrap);
    return;
  }

  if(stage==='vote'){
    if(day.nominees.length===0){ dayAdvanceStage(); return; }
    if(!day.voteCounts) day.voteCounts = {};
    const num = day.nominees[day.voteIndex];
    const isLastVote = day.voteIndex >= day.nominees.length-1;
    const count = day.voteCounts[num] || 0;
    root.appendChild(el(`<div class="night-banner">Голосуємо за гравця №${num}. <span class="muted">(${day.voteIndex+1} з ${day.nominees.length})</span></div>`));

    const navWrap = el(`<div class="app-nav"></div>`);
    const backBtn = el(`<button class="ghost">Назад</button>`);

      pushUndo();
      if(!isLastVote){ day.voteIndex++; saveGame(); render(); }
      else { day.resultPhase='tally'; dayAdvanceStage(); }
    });
    navWrap.appendChild(backBtn);
    navWrap.appendChild(next);
    nav.appendChild(navWrap);
    return;
  }

  if(stage==='result'){

      const disp = el(`<div class="timer-display" style="margin:0; font-size:40px;">${count}</div>`);
      const plus = el(`<button class="small ghost">+</button>`);
      minus.addEventListener('click', ()=>{ day.tieVoteCounts[num] = Math.max(0,(day.tieVoteCounts[num]||0)-1); saveGame(); render(); });
      plus.addEventListener('click', ()=>{ day.tieVoteCounts[num] = (day.tieVoteCounts[num]||0)+1; saveGame(); render(); });
      row.appendChild(minus); row.appendChild(disp); row.appendChild(plus);
      card2.appendChild(row);
      root.appendChild(card2);
      const next = el(`<button class="primary">${isLastTV ? 'Далі' : 'Наступний'}</button>`);
      next.addEventListener('click', ()=>{
        pushUndo();
        if(!isLastTV){ day.tieVoteIndex++; saveGame(); render(); }
        else {
          const counts2 = day.tieVoteCounts;
          const maxCount2 = Math.max(0, ...day.tieCandidates.map(n=>counts2[n]||0));
          const candidates2 = day.tieCandidates.filter(n=>(counts2[n]||0)===maxCount2);
          if(maxCount2>0 && candidates2.length===1){
            day.eliminatedNumber = candidates2[0];
            day.resultPhase = 'announce';
          } else {
            day.resultPhase = 'tie-none';
          }
          saveGame(); render();
        }
      });
      navWrap.appendChild(backBtn); navWrap.appendChild(next);
      nav.appendChild(navWrap);
      return;
    }

    if(day.resultPhase==='tie-none'){
      root.appendChild(el(`<div class="night-banner">І цього разу нічия. Оголоси: сьогодні місто нікого не виганяє. Настає ніч.</div>`));
      const next = el(`<button class="primary">Завершити день</button>`);
      next.addEventListener('click', ()=>{ pushUndo(); finishDay(); });
      navWrap.appendChild(backBtn); navWrap.appendChild(next);
      nav.appendChild(navWrap);
      return;
    }

    if(day.resultPhase==='announce'){
      const num = day.eliminatedNumber;
      root.appendChild(el(`<div class="night-banner">Скажи гравцям: «Гравець під номером ${num} вибуває з гри».</div>`));
      const next = el(`<button class="primary">Далі — останнє слово</button>`);
      next.addEventListener('click', ()=>{
        pushUndo();
        const p = g.players.find(pl=>pl.number===num);
        if(p) p.alive = false;
        day.resultPhase = 'lastword';
        saveGame(); render();
      });
      navWrap.appendChild(backBtn); navWrap.appendChild(next);
      nav.appendChild(navWrap);
      return;
    }

    if(day.resultPhase==='lastword'){
      const num = day.eliminatedNumber;
      root.appendChild(el(`<div class="night-banner">Останнє слово гравця №${num}.</div>`));
      const card = el(`<div class="card"></div>`);
      renderTimerBlock(card, state.settings.timers.lastWord, ()=>{}, `№${num} · ${state.settings.timers.lastWord} сек`);
      root.appendChild(card);
      const next = el(`<button class="primary">Завершити день</button>`);
      next.addEventListener('click', ()=>{ stopTimer(); pushUndo(); finishDay(); });
      navWrap.appendChild(backBtn); navWrap.appendChild(next);
      nav.appendChild(navWrap);
      return;
    }
  }
}

function finishDay(){
  const g = state.game;
  const day = g.day;
  const eliminated = day ? (day.eliminatedNumber || null) : null;
  g.log.push({round:g.round, type:'day', eliminated, nominees: day?day.nominees.slice():[]});
  if(computeWinner()){
    state.screen='end'; g.screen='end'; saveGame(); render(); return;
  }
  g.round++;
  beginNight();
}

/* ================= END SCREEN ================= */
function renderEnd(root, nav){
  const g = state.game;
  const w = computeWinner();
  if(!g.statsRecorded && w){
    const s = state.settings;
    if(!s.stats) s.stats = {black:0, red:0, maniac:0, draws:0};
    if(w==='black') s.stats.black++;
    else if(w==='red') s.stats.red++;
    else if(w==='maniac') s.stats.maniac++;
    g.statsRecorded = true;
    saveSettings();
    saveGame();
  }
  const winner = w==='red' ? 'Мирні перемогли!' : (w==='maniac' ? 'Маніяк переміг!' : 'Мафія перемогла!');
  const congrats = w==='red' ? ((g.theme&&g.theme.peacefulWin)||'Мафії більше немає.')
    : w==='maniac' ? 'Лишились тільки Маніяк і по одному з кожної команди — і Маніяк забрав усе собі.'
    : ((g.theme&&g.theme.mafiaWin)||'Мафію вже не переголосувати.');
  root.appendChild(el(`<div class="card"><h2>${winner}</h2><div class="muted" style="margin-top:4px;">${congrats}</div><div class="muted" style="margin-top:8px;">Раунд: ${g.round}</div></div>`));
  const card = el(`<div class="card"><h3>Активні ролі</h3><div class="assign-list" id="finalList"></div></div>`);
  const list = card.querySelector('#finalList');
  g.players.filter(p=>p.roleId!=='peaceful').forEach(p=>{
    const r = roleById(p.roleId);
    list.appendChild(el(`<div class="kv"><span>№${p.number} ${p.alive?'':'(вибув)'}</span><span><span class="team-dot ${r.team}"></span>${r.name}</span></div>`));
  });
  root.appendChild(card);
  const navWrap = el(`<div class="app-nav"></div>`);
  const again = el(`<button class="primary">Нова гра (ті самі налаштування)</button>`);
  again.addEventListener('click', ()=>{ clearGame(); state.game=null; state.screen='setup'; undoStack=[]; try{localStorage.removeItem(UNDO_KEY);}catch(e){} startGame(); });
  navWrap.appendChild(again);
  nav.appendChild(navWrap);
}

/* ================= ROLE DEALING TOOL (independent of the main game) ================= */
let roleDealState = null;
let preRoleDealScreen = null;
function openRoleDeal(){
  preRoleDealScreen = state.screen;
  roleDealState = {
    step:'setup',
    playerCount: state.settings.playerCount,
    direction: state.settings.direction || 'cw',
  };
  state.screen = 'roledeal';
  render();
}
function closeRoleDeal(){
  state.screen = preRoleDealScreen || 'setup';
  roleDealState = null;
  render();
}
function roleDealPool(playerCount){
  const roles = state.settings.roles;
  let nonPeacefulTotal = 0;
  const pool = [];
  roles.forEach(r=>{
    if(r.id==='peaceful') return;
    nonPeacefulTotal += r.count;
    for(let i=0;i<r.count;i++) pool.push(r.name);
  });
  const peacefulCount = Math.max(0, playerCount - nonPeacefulTotal);
  for(let i=0;i<peacefulCount;i++) pool.push('Мирний житель');
  return { pool, overflow: Math.max(0, nonPeacefulTotal - playerCount) };
}
function renderRoleDeal(root, nav){
  const rd = roleDealState;
  const navWrap = el(`<div class="app-nav"></div>`);

  if(rd.step==='setup'){
    root.appendChild(el(`<div class="card"><h3>Роздати ролі</h3><div class="muted">Окремий інструмент для швидкої випадкової роздачі ролей — не впливає на основну гру. Ролі й кількість кожної беруться з поточних налаштувань гри.</div></div>`));

    const card = el(`<div class="card"></div>`);
    card.appendChild(el(`<div class="field-label">Кількість гравців</div>`));
    const countBtn = el(`<button style="font-family:'IBM Plex Mono',monospace; font-size:17px; padding:8px 18px; background:var(--panel-2); border:1px solid var(--line); border-radius:8px; color:var(--text);">${rd.playerCount}</button>`);
    card.appendChild(countBtn);
    const pickerHost = el(`<div></div>`);
    card.appendChild(pickerHost);
    countBtn.addEventListener('click', ()=>{
      rd.countPickerOpen = !rd.countPickerOpen;
      render();
    });
    if(rd.countPickerOpen){
      const grid = el(`<div class="player-grid" style="margin-top:10px;"></div>`);
      for(let n=4;n<=21;n++){
        const b = el(`<button class="player-btn ${n===rd.playerCount?'selected':''}" style="aspect-ratio:auto; height:40px; font-size:14px;">${n}</button>`);
        b.addEventListener('click', ()=>{ rd.playerCount=n; rd.countPickerOpen=false; render(); });
        grid.appendChild(b);
      }
      pickerHost.appendChild(grid);
    }

    card.appendChild(el(`<label class="field-label" style="margin-top:14px;">Напрямок виклику гравців</label>`));
    const seg = el(`<div class="segmented"></div>`);
    const cwBtn = el(`<button class="small ${rd.direction==='cw'?'active':''}">За годинниковою (1→2→3…)</button>`);
    const ccwBtn = el(`<button class="small ${rd.direction==='ccw'?'active':''}">Проти годинникової (${rd.playerCount}→${rd.playerCount-1}→…)</button>`);
    cwBtn.addEventListener('click', ()=>{ rd.direction='cw'; render(); });
    ccwBtn.addEventListener('click', ()=>{ rd.direction='ccw'; render(); });
    seg.appendChild(cwBtn); seg.appendChild(ccwBtn);
    card.appendChild(seg);
    root.appendChild(card);

    const { pool, overflow } = roleDealPool(rd.playerCount);
    const peacefulInPool = pool.filter(n=>n==='Мирний житель').length;
    const rolesCard = el(`<div class="card"><div class="field-label">Ролі (з налаштувань гри)</div></div>`);
    state.settings.roles.forEach(r=>{
      if(r.id!=='peaceful' && r.count===0) return;
      const cnt = r.id==='peaceful' ? peacefulInPool : r.count;
      rolesCard.appendChild(el(`<div class="kv"><span>${r.name}</span><span>${cnt}</span></div>`));
    });
    root.appendChild(rolesCard);
    if(overflow>0){
      root.appendChild(el(`<div class="muted" style="color:var(--danger);">Ролей на ${overflow} більше, ніж гравців. Зменш кількість ролей у Налаштуваннях або збільш кількість гравців тут.</div>`));
    }

    const exitBtn = el(`<button class="ghost">Назад</button>`);
    exitBtn.addEventListener('click', closeRoleDeal);
    const startBtn = el(`<button class="primary" ${overflow>0?'disabled':''}>Почати роздачу</button>`);
    startBtn.addEventListener('click', ()=>{
      const shuffled = shuffle(pool);
      const assignments = {};
      for(let i=1;i<=rd.playerCount;i++) assignments[i] = shuffled[i-1];
      const order = [];
      for(let i=0;i<rd.playerCount;i++){
        order.push(rd.direction==='cw' ? i+1 : rd.playerCount-i);
      }
      rd.assignments = assignments;
      rd.order = order;
      rd.pos = 0;
      rd.step = 'announce';
      render();
    });
    navWrap.appendChild(exitBtn);
    navWrap.appendChild(startBtn);
    nav.appendChild(navWrap);
    return;
  }

  if(rd.step==='announce'){
    const num = rd.order[rd.pos];
    root.appendChild(el(`<div class="card"><h3>Зараз гравець №${num}</h3><div class="muted">Передай телефон гравцю під номером ${num}. Коли він готовий — натисни "Показати роль".</div></div>`));
    const exitBtn = el(`<button class="ghost">Вийти</button>`);
    exitBtn.addEventListener('click', closeRoleDeal);
    const next = el(`<button class="primary">Показати роль</button>`);
    next.addEventListener('click', ()=>{ rd.step='reveal'; render(); });
    navWrap.appendChild(exitBtn);
    navWrap.appendChild(next);
    nav.appendChild(navWrap);
    return;
  }

  if(rd.step==='reveal'){
    const num = rd.order[rd.pos];
    const roleName = rd.assignments[num];
    const isLast = rd.pos >= rd.order.length-1;
    root.appendChild(el(`<div class="card"><h3>Гравець №${num}</h3><div class="theme-text">Твоя роль: <b>${roleName}</b></div><div class="muted" style="margin-top:8px;">Запам'ятай і передай телефон далі.</div></div>`));
    const exitBtn = el(`<button class="ghost">Вийти</button>`);
    exitBtn.addEventListener('click', closeRoleDeal);
    const next = el(`<button class="primary">${isLast ? 'Готово' : 'Далі'}</button>`);
    next.addEventListener('click', ()=>{
      if(isLast){ rd.step='done'; }
      else { rd.pos++; rd.step='announce'; }
      render();
    });
    navWrap.appendChild(exitBtn);
    navWrap.appendChild(next);
    nav.appendChild(navWrap);
    return;
  }

  if(rd.step==='done'){
    root.appendChild(el(`<div class="card"><h3>Усі ролі роздано!</h3><div class="muted">Можна починати гру за звичайним сценарієм.</div></div>`));
    const again = el(`<button class="ghost">Роздати ще раз</button>`);
    again.addEventListener('click', ()=>{ rd.step='setup'; rd.countPickerOpen=false; render(); });
    const exitBtn = el(`<button class="primary">Назад у меню</button>`);
    exitBtn.addEventListener('click', closeRoleDeal);
    navWrap.appendChild(again);
    navWrap.appendChild(exitBtn);
    nav.appendChild(navWrap);
    return;
  }
}

      if(entry.type==='night'){
        const deaths = entry.summary && entry.summary.deaths ? entry.summary.deaths : [];
        const text = deaths.length ? `Вбито гравця${deaths.length>1?'ів':''}: №${deaths.join(', №')}` : 'Ніхто не загинув';
        const card = el(`<div class="card"><h3>Ніч ${entry.round}</h3><div>${text}</div></div>`);
        if(entry.summary && entry.summary.checks && entry.summary.checks.length){
          entry.summary.checks.forEach(c=>{
            let line='';
            if(c.type==='don') line = `Дон перевірив №${c.target}: ${c.result?'це шериф':'не шериф'}`;
            if(c.type==='sheriff') line = `Шериф перевірив №${c.target}: колір — ${c.result==='black'?'чорний':'червоний'}`;
            if(c.type==='journalist') line = `Журналіст: №${c.targets[0]} і №${c.targets[1]} — ${c.sameTeam?'одна команда':'різні команди'}`;
            card.appendChild(el(`<div class="muted" style="margin-top:4px;">${line}</div>`));
          });
        }
        root.appendChild(card);
      } else if(entry.type==='day'){
        const text = entry.eliminated ? `Вигнано гравця №${entry.eliminated}` : (entry.nominees && entry.nominees.length ? 'Голосування відбулось, ніхто не вигнаний' : 'Нікого не виставили на голосування');
        root.appendChild(el(`<div class="card"><h3>День ${entry.round}</h3><div>${text}</div></div>`));
      }
    });
  }
  const navWrap = el(`<div class="app-nav"></div>`);
  const back = el(`<button class="primary">Назад до гри</button>`);
  back.addEventListener('click', closeHistory);
  navWrap.appendChild(back);
  nav.appendChild(navWrap);
}

/* ================= boot ================= */
if(state.screen==='night') render = wrapNightRender();
function wrapNightRender(){ return render; }
// route night renders through summary-aware function
const _renderOriginal = render;
render = function(){
  document.getElementById('phaseLabel').textContent = phaseLabelFor();
  const root = document.getElementById('screens');
  root.innerHTML = '';
  const nav = document.getElementById('navBar');
  nav.innerHTML = '';
  if(state.screen==='setup') renderSetup(root, nav);
  else if(state.screen==='theme') renderTheme(root, nav);
  else if(state.screen==='immunity') renderImmunity(root, nav);
  else if(state.screen==='acquaint') renderAcquaint(root, nav);
  else if(state.screen==='night') renderNightRouter(root, nav);
  else if(state.screen==='day') renderDay(root, nav);
  else if(state.screen==='end') renderEnd(root, nav);
  else if(state.screen==='history') renderHistory(root, nav);
  else if(state.screen==='notes') renderNotes(root, nav);
  else if(state.screen==='rules') renderRules(root, nav);
  else if(state.screen==='stats') renderStats(root, nav);
  else if(state.screen==='roledeal') renderRoleDeal(root, nav);
  else { state.screen='setup'; state.game=null; clearGame(); renderSetup(root, nav); }
};

render();

(function(){
  const splash = document.getElementById('splashOverlay');
  const canvas = document.getElementById('splashCanvas');
  if(!splash || !canvas) return;
  const ctx = canvas.getContext('2d');

  const W = window.innerWidth, H = window.innerHeight;
  canvas.width = W;
  canvas.height = H;

  const bgColor = getComputedStyle(document.documentElement).getPropertyValue('--bg').trim() || '#12151a';
  const textColor = getComputedStyle(document.documentElement).getPropertyValue('--text').trim() || '#eee9df';
  const lampColor = getComputedStyle(document.documentElement).getPropertyValue('--lamp').trim() || '#e2a33d';

  function drawScene(){
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = bgColor;
    ctx.fillRect(0, 0, W, H);
    ctx.textAlign = 'center';
    const cx = W/2;
    let cy = H/2 - 70;

    ctx.font = '52px sans-serif';
    ctx.fillText('🎭', cx, cy);
    cy += 70;

    ctx.fillStyle = textColor;
    ctx.font = "700 36px 'Fraunces', serif";
    ctx.fillText('Ведучий Мафії', cx, cy);
    cy += 46;

    ctx.font = "19px 'Fraunces', serif";
    ctx.fillStyle = textColor;
    ctx.fillText('Розроблено для', cx, cy);
    cy += 30;
    ctx.fillStyle = lampColor;
    ctx.fillText('The Corner Studio', cx, cy);
    cy += 30;
    ctx.fillStyle = textColor;
    ctx.fillText('— Вікториною Новак', cx, cy);
  }

  function startDissolve(){
    const cols = 28, rows = 44;
    const cellW = W / cols, cellH = H / rows;
    const totalSweep = 4700;
    const cells = [];
    for(let r=0;r<rows;r++){
      for(let c=0;c<cols;c++){
        const nx = (c+0.5)/cols, ny = (r+0.5)/rows;
        const edgeDist = Math.min(nx, 1-nx, ny, 1-ny) * 2; // 0 at edge, ~1 at center
        const delay = edgeDist * totalSweep + Math.random()*150;
        cells.push({ x:c*cellW, y:r*cellH, delay, cleared:false });
      }
    }

    let dismissed = false;
    let rafId = null;
    function dismissInstant(){
      if(dismissed) return;
      dismissed = true;
      if(rafId) cancelAnimationFrame(rafId);
      splash.remove();
    }
    document.getElementById('splashClose').addEventListener('click', dismissInstant);

    const startTime = performance.now();
    function tick(now){
      const elapsed = now - startTime;
      let allCleared = true;
      for(const cell of cells){
        if(cell.cleared) continue;
        if(elapsed >= cell.delay){
          ctx.clearRect(cell.x - 1, cell.y - 1, cellW + 2, cellH + 2);
          cell.cleared = true;
        } else {
          allCleared = false;
        }
      }
      if(!allCleared && !dismissed){
        rafId = requestAnimationFrame(tick);
      } else if(!dismissed){
        dismissInstant();
      }
    }
    rafId = requestAnimationFrame(tick);
  }

  // make sure the custom font is actually loaded before we draw the text onto the canvas,
  // but never wait more than a moment for it
  let started = false;
  function startOnce(){ if(started) return; started = true; drawScene(); startDissolve(); }
  if(document.fonts && document.fonts.ready){
    document.fonts.load("700 36px 'Fraunces'").catch(()=>{});
    document.fonts.load("19px 'Fraunces'").catch(()=>{});
    document.fonts.ready.then(startOnce).catch(startOnce);
    setTimeout(startOnce, 500);
  } else {
    startOnce();
  }
})();
</script>
