  {text:"Мольберти готові, місяць уже зійшов! Художник орендував старий вітряний млин на околиці, щоб провести творчу резиденцію — кілька тижнів живопису на самоті серед степу. Сьогодні до нього приїхали друзі-художники подивитись на нові роботи, і млин освітлюється свічками, розставленими по всіх поверхах. На одному з полотен, ще не висохлому, зображено обличчя, якого художник запевняє, що ніколи не малював. Вітер крутить старі крила млина зі скрипом, і від цього звуку всім стає трохи моторошно. Місто засинає.",
   mafiaWin:"Млин, мольберти й усі картини забрала собі мафія. Мафія перемагає!",
   peacefulWin:"Мафію розписали фарбою і здали просто на місці. Мирні перемагають!"},
  {text:"Хміль і солод не сплять! Маленька крафтова броварня варить нову партію пива цілу ніч, бо процес не можна переривати ні на годину, чани булькають, пивовар щогодини знімає проби ареометром. Замовлення особливе — для великого весілля, тож помилки тут неприпустимі. Раптом ареометр показує цифри, яких при цьому рецепті просто не може бути, і пивовар підозріло дивиться на свого нового підмайстра. Пара над чанами піднімається все густіше. Місто засинає.",
   mafiaWin:"Броварню, рецепт і всю партію пива забрала собі мафія. Мафія перемагає!",
   peacefulWin:"Мафію процідили разом із хмелем. Мирні перемагають!"},
  {text:"Вода реве, турбіни крутяться! Нічна вахта на невеликій гідроелектростанції на гірській річці — робота монотонна, та відповідальна: перепад рівня води треба контролювати щогодини. Двоє чергових інженерів по черзі обходять машинний зал із ліхтариками, звіряючи показники приладів. Один із приладів раптом фіксує різкий стрибок навантаження, якого нізвідки взятись не могло. Гуркіт турбін заглушає майже всі звуки, окрім тривожного сигналізатора. Місто засинає.",
   mafiaWin:"Станцію, турбіни й усе електропостачання перехопила мафія. Мафія перемагає!",
   peacefulWin:"Мафію змило разом із зайвим напором води. Мирні перемагають!"},
  {text:"Телескоп наведено на комету! Гірська обсерваторія відкрила двері для аматорів астрономії на честь рідкісного проходження комети, яке буває раз на кілька десятиліть. Науковий співробітник по черзі підпускає кожного до окуляра, пояснюючи, куди дивитись. Комп'ютер, що керує куполом обсерваторії, раптом сам, без команди, починає повертати телескоп у геть іншому напрямку. Усі перезираються, поки директор обсерваторії намагається зрозуміти, хто міг отримати доступ до системи керування. Місто засинає.",
   mafiaWin:"Обсерваторію, комету й усі зорі забрала собі мафія. Мафія перемагає!",
   peacefulWin:"Мафію навели прямо в об'єктив і сфотографували. Мирні перемагають!"},
  {text:"Мед уже майже готовий до зими! Пасічники цілого району зібрались на щорічну ярмаркову дегустацію меду, банки з різними сортами вишикувані довгими рядами на столах. Журі із заплющеними очима визначає найкращий сорт за смаком, а глядачі активно роблять ставки, хто цьогоріч переможе. У розпал дегустації одна з банок виявляється підписаною зовсім не тим сортом, який у ній насправді. Пасічники схвильовано перешіптуються, підозрюючи підміну заради першого місця. Місто засинає.",
   mafiaWin:"Мед, банки й усю ярмарку прибрала до рук мафія. Мафія перемагає!",
   peacefulWin:"Мафію засолодили і здали разом із рештою меду. Мирні перемагають!"},
  {text:"Ювілейна партія триває! Маленький сільський шаховий клуб святкує п'ятдесятиріччя свого заснування турніром, у якому грають одночасно ветерани й наймолодші учасники. Старий годинник із затертими цифрами відраховує час кожному гравцю, а голова клубу пригадує історії з минулих турнірів між ходами. Раптом одна партія затягується підозріло довго, і суперник голови клубу відмовляється пояснювати свою стратегію. Присутні починають підозрювати, що тут грають не лише в шахи. Місто засинає.",
   mafiaWin:"Ювілей, кубок і сам клуб забрала собі мафія. Мафія перемагає!",
   peacefulWin:"Мафії поставили мат просто на ювілейній партії. Мирні перемагають!"},
  {text:"Ковадло не втомлюється всю ніч! Сільський коваль отримав термінове замовлення на кований паркан для великого весілля і мусить впоратись до ранку, іскри летять від ковадла, міхи роздмухують вогонь у горні. Син коваля допомагає тримати заготовки, а сусід забіг допомогти, бо роботи забагато для однієї пари рук. Раптом один із готових елементів паркану виявляється викуваним за геть іншим візерунком, ніж замовляли, і ніхто не зізнається, чия це робота. Горно продовжує гудіти, а часу лишається все менше. Місто засинає.",
   mafiaWin:"Кузню, ковадло й усе замовлення забрала собі мафія. Мафія перемагає!",
   peacefulWin:"Мафію перекували разом з рештою заліза. Мирні перемагають!"},
  {text:"Останній столик прибирають повільно! Ресторан на набережній зачиняє літню терасу востаннє цього сезону, офіціанти згортають скатертини, а шеф-кухар готує прощальну вечерю для всього персоналу. Осіннє повітря вже прохолодне, свічки на столах горять востаннє перед довгою паузою до весни. Раптом хтось із персоналу зникає з рахунком одного зі столиків, не встигнувши здати виторг. Хвилі тихо б'ються об причал, поки всі шукають зниклого офіціанта. Місто засинає.",
   mafiaWin:"Терасу, виторг і весь ресторан забрала собі мафія. Мафія перемагає!",
   peacefulWin:"Мафію винесли разом з останнім столиком. Мирні перемагають!"},
  {text:"Ляльки чекають своєї прем'єри! Обласний театр ляльок готує прем'єру просто перед показом, майстер-ляльковод востаннє перевіряє нитки маріонеток за лаштунками. Кожна лялька має свій характер, і помилитись у русі не можна на очах у дитячого залу. Раптом одна з ляльок виявляється підмінена геть іншою — схожою, але з інакше розписаним обличчям. Ляльковод розгублено крутить її в руках, не розуміючи, звідки вона взялась. Місто засинає.",
   mafiaWin:"Театр, ляльок і всю прем'єру забрала собі мафія. Мафія перемагає!",
   peacefulWin:"Мафію смикнули за ниточки й здали просто на сцені. Мирні перемагають!"},
  {text:"Виклик прийнято, чекаємо на пасажира! Диспетчерська невеликого таксопарку в провінційному містечку працює цілу ніч, рації потріскують, водії по черзі доповідають про виконані виклики. Один із постійних водіїв отримує дивний виклик на адресу, якої за довідником просто не існує. Диспетчерка перепитує адресу двічі, але лінія обривається на середині фрази. Решта водіїв тим часом продовжують возити звичайних пасажирів по звичайних вулицях. Місто засинає.",
   mafiaWin:"Диспетчерську, рації й увесь таксопарк перехопила мафія. Мафія перемагає!",
   peacefulWin:"Мафію висадили посеред виклику й більше не підвозили. Мирні перемагають!"},
  {text:"Масло збивають ще з вечора! Сільська маслоробня приймає молоко з довколишніх господарств цілу ніч, сепаратори гудуть, бідони вишикувані вздовж стіни. Завідувачка веде облік надоїв від кожного двору, звіряючи цифри з минулим тижнем. Раптом один із бідонів виявляється значно важчим, ніж має бути за записами, і всередині масла ховається щось, чого там точно бути не мало. Робота на маслоробні, тим часом, не спиняється ні на хвилину. Місто засинає.",
   mafiaWin:"Маслоробню, бідони й усі надої забрала собі мафія. Мафія перемагає!",
   peacefulWin:"Мафію збили в масло разом із рештою молока. Мирні перемагають!"},
  {text:"Стрижка отари починається затемна! Кооператив вівчарів зібрався на щорічну стрижку отари, яку заведено починати ще до світанку, поки овечки спокійніші. Ножиці клацають одна за одною, вовна складається у великі мішки для подальшої обробки. Один із наймитів раптом ховає щось під купою свіжостриженої вовни, коли думає, що ніхто не бачить. Отара тим часом дедалі гучніше мекає, наче відчуваючи щось недобре. Місто засинає.",
   mafiaWin:"Отару, вовну й увесь кооператив прибрала до рук мафія. Мафія перемагає!",
   peacefulWin:"Мафію обстригли й здали разом із рештою вовни. Мирні перемагають!"},
  {text:"Останній акорд перед конкурсом! Аматорський камерний оркестр репетирує до пізньої ночі перед обласним конкурсом, диригент вимогливо стукає паличкою по пюпітру, вимагаючи повторити пасаж ще раз. Скрипалі втомлено опускають смички між заходами, духові інструменти час від часу фальшивлять від утоми. Раптом партитура одного з музикантів виявляється переписаною геть в іншій тональності, і ніхто не розуміє, коли це сталося. До конкурсу лишається одна репетиція. Місто засинає.",
   mafiaWin:"Оркестр, партитуру й перше місце забрала собі мафія. Мафія перемагає!",
   peacefulWin:"Мафію зняли з конкурсу за фальшиву ноту. Мирні перемагають!"},
  {text:"Перша крапля щойно скрапнула! Невеликий сільський самогонний апарат ліцензованої міні-дистилерії працює цілу ніч над новою партією фруктової горілки, змійовик парує, майстер куштує кожну нову порцію на смак і фортецю. Замовлення особливе — для ювілею сільського голови, тож якість має бути бездоганною. Раптом у готовій партії з'являється присмак, якого там точно не мало бути, і майстер підозріло дивиться на свого помічника. Апарат, тим часом, продовжує парувати. Місто засинає.",
   mafiaWin:"Дистилерію, рецепт і всю партію забрала собі мафія. Мафія перемагає!",
   peacefulWin:"Мафію перегнали разом з рештою браги. Мирні перемагають!"},
  {text:"Право на керування здають цієї ночі! Автошкола провінційного містечка проводить нічний практичний іспит для тих, хто не встиг здати вдень — правила дозволяють це у виняткових випадках. Інструктор сидить на пасажирському сидінні з планшетом, фіксуючи кожну помилку. Один із кандидатів раптом демонструє водійські навички, які явно виходять за межі звичайного учня автошколи. Інструктор підозріло переглядає його особову справу. Місто засинає.",
   mafiaWin:"Автошколу, права й усіх інструкторів прибрала до рук мафія. Мафія перемагає!",
   peacefulWin:"Мафію розвернули і не здали з першого разу. Мирні перемагають!"},
  {text:"Книжки чекають на своїх читачів! Обласна бібліотека готує нічну ярмарку списаних книг напередодні великого книжкового фестивалю, стелажі виставлені просто на вулиці під ліхтарями, волонтери сортують книги за жанрами. Раптом одна з коробок виявляється заповненою геть не книгами, а чимось важчим і загорнутим у стару газету. Волонтери розгублено дивляться одне на одного, не знаючи, хто приніс цю коробку. Місто засинає.",
   mafiaWin:"Бібліотеку, ярмарку й усі книги забрала собі мафія. Мафія перемагає!",
   peacefulWin:"Мафію зачитали до дірки й здали бібліотекарю. Мирні перемагають!"},
  {text:"Останній стібок перед фестивалем! Майстерня ляльок-мотанок готує партію традиційних оберегів до великого етнофестивалю, кольорові клаптики розкладені по всьому столу, майстрині наспівують стародавні пісні за роботою. Кожна лялька в'яжеться без голки, лише вузликами, і кожен вузлик має своє значення для того, кому обереги призначені. Раптом одна з ляльок виявляється зав'язаною геть не за традицією, а майстриня, що її робила, нізвідки не зникала з-за столу. Місто засинає.",
   mafiaWin:"Майстерню, обереги й увесь фестиваль забрала собі мафія. Мафія перемагає!",
   peacefulWin:"Мафію розв'язали вузлик за вузликом. Мирні перемагають!"},
  {text:"Ласкаво просимо до іконописної майстерні! Монастирська майстерня реставрує старовинну ікону, яку мають урочисто повернути до храму вже завтра вранці, після кількох місяців кропіткої роботи. Реставратор працює під лупою при світлі свічки, бо електричне освітлення тут вважають недоречним для такої справи. Настоятель щовечора заходить подивитись на прогрес і щоразу хреститься, побачивши, як образ поступово оживає з-під шарів старого лаку. Сьогодні, коли робота майже завершена, реставратор помічає під верхнім шаром фарби напис, якого не було в жодному з попередніх описів ікони. Свічка догоряє, а таємниця під фарбою чекає, поки її розкриють обережним дотиком пензля. Місто засинає.",
   mafiaWin:"Ікону, майстерню і саму таємницю забрала собі мафія. Мафія перемагає!",
   peacefulWin:"Мафію розписали і повернули просто до іконостасу. Мирні перемагають!"},
  {text:"Світло на всі боки, кораблі чекають! Старовинний маяк на скелястому березі, вже кілька десятиліть як переведений у статус музею, цієї ночі вмикає ліхтар востаннє — на прохання відомого режисера для зйомок фінальної сцени фільму. Доглядач маяка, який працює тут ще з тих часів, коли маяк був справжнім, показує знімальній групі механізм обертання лінзи Френеля. Кіношники розставляють апаратуру по всіх сходах гвинтових сходів, а звукооператор скаржиться на дивний скрип, якого немає в жодному з дублів. Раптом лампа маяка гасне сама, хоча ніхто не торкався вимикача, і промінь світла, який мав освітлювати весь берег, зникає в темряві. Доглядач заявляє, що таке трапляється раз на сто років, і саме перед бідою. Місто засинає.",
   mafiaWin:"Маяк, фільм і все узбережжя забрала собі мафія. Мафія перемагає!",
   peacefulWin:"Мафію освітили прожектором маяка і зняли просто там. Мирні перемагають!"},
  {text:"Кошик наповнюється лозою! Артіль лозоплетіння отримала велике замовлення на кошики для завтрашнього обласного ярмарку ремесел, і майстри плетуть цілу ніч, встромляючи вербові прути один за одним у чіткому ритмі. Найстарший майстер артілі показує молодшим особливий візерунок плетіння, який ще його дід приніс із заробітків на Полтавщині. Робота йде швидко, кошики ростуть рядами при світлі гасових ламп, бо електрику в старій майстерні так і не провели. Раптом один із готових кошиків, ще не досохлий, виявляється сплетеним геть іншим візерунком — тим, якого ніхто з присутніх не вчив. Майстер підозріло оглядає всіх учнів по черзі, намагаючись зрозуміти, звідки той узявся. Місто засинає.",
   mafiaWin:"Артіль, кошики і весь ярмарок забрала собі мафія. Мафія перемагає!",
   peacefulWin:"Мафію заплели у власний кошик і здали на ярмарок. Мирні перемагають!"},
  {text:"Струни чекають на майстра! Майстерня музичних інструментів отримала замовлення відреставрувати стару бандуру для відомого кобзаря, який має виступати на великому концерті вже за добу. Майстер обережно натягує кожну струну, перевіряючи звук на слух, бо жоден прилад не замінить вухо, натреноване десятиліттями. Учень тримає інструмент, поки майстер підкручує кілочки, і обидва тихо наспівують стару думу, щоб перевірити резонанс деки. Раптом одна зі струн лунає геть іншим звуком, ніж усі решта, хоча її щойно замінили на нову. Майстер відкладає інструмент і уважно оглядає деку зсередини через маленький отвір. Місто засинає.",
   mafiaWin:"Бандуру, майстерню і весь концерт забрала собі мафія. Мафія перемагає!",
   peacefulWin:"Мафію настроїли і здали просто на репетиції. Мирні перемагають!"},
  {text:"Гобелен росте нитка за ниткою! Ткацька майстерня виконує замовлення обласного музею — великий гобелен із зображенням історичної битви, над яким майстрині працюють уже кілька місяців позмінно. Сьогодні остання нічна зміна перед тим, як роботу знімуть із верстата і відправлять на реставраційну виставку. Старша ткаля перевіряє кожен ряд ниток проти ескізу, наколотого поруч на стіні. Раптом виявляється, що частина візерунка внизу гобелена виткана геть іншими кольорами, ніж передбачав ескіз, хоча буквально годину тому там усе було правильно. Верстат скрипить, а часу на переробку майже не лишилось. Місто засинає.",
   mafiaWin:"Гобелен, верстат і весь музей забрала собі мафія. Мафія перемагає!",
   peacefulWin:"Мафію розплутали нитка за ниткою. Мирні перемагають!"},
  {text:"Бурштин ще пахне живицею! Ювелірна майстерня обробляє партію бурштину, щойно привезену з розкопів на Рівненщині, щоб устигнути до завтрашньої виставки українських самоцвітів у обласному центрі. Майстер шліфує кожен камінь під лупою, відкладаючи найкращі зразки в оксамитову скриньку. Підмайстер веде облік ваги кожного каменя в товстому зошиті, бо партія коштовна і помилки тут неприпустимі. Раптом один із найбільших самородків виявляється підміненим на скляну підробку, майстерно розфарбовану під бурштин. Майстер довго крутить підробку проти світла, не вірячи власним очам. Місто засинає.",
   mafiaWin:"Майстерню, бурштин і всю виставку забрала собі мафія. Мафія перемагає!",
   peacefulWin:"Мафію відшліфували і здали просто під лупу. Мирні перемагають!"},
  {text:"Мотор реве, крила чекають! Колекціонер старовинних автомобілів готує свій головний експонат — ретро-кабріолет тридцятих років — до завтрашнього параду вінтажних машин у центрі міста. Механік у гаражі перебирає карбюратор при світлі переносної лампи, а сам колекціонер полірує кожен сантиметр хромованого бампера, наспівуючи собі під ніс старий фокстрот. Машина має бути ідеальною — це єдиний вцілілий екземпляр такої моделі в усій країні. Раптом під сидінням водія знаходять предмет, якого там точно не мало бути, судячи з подиву на обличчі самого колекціонера. Механік відкладає гайковий ключ і уважно роздивляється знахідку. Місто засинає.",
   mafiaWin:"Гараж, кабріолет і весь парад забрала собі мафія. Мафія перемагає!",
   peacefulWin:"Мафію завели з першого разу і здали на параді. Мирні перемагають!"},
  {text:"Клавіші чекають на віртуоза! Майстерня з реставрації роялів отримала термінове замовлення — відомий піаніст має завтра дати єдиний концерт у місті на легендарному інструменті, який простояв розстроєним у філармонії кілька років. Настроювач працює всю ніч, перевіряючи кожну клавішу і струну, підкручуючи кілочки з ювелірною точністю. Двірник філармонії, що затримався допізна, приносить чай і слухає, як інструмент поступово оживає під вправними руками майстра. Раптом одна клавіша западає і не піднімається, хоча секунду тому грала бездоганно. Настроювач знімає верхню кришку рояля і зазирає всередину з ліхтариком. Місто засинає.",
   mafiaWin:"Рояль, філармонію і весь концерт забрала собі мафія. Мафія перемагає!",
   peacefulWin:"Мафію настроїли на потрібний лад і здали просто на сцені. Мирні перемагають!"},
  {text:"Човен-довбанка старший за саме місто! Місцевий краєзнавчий музей отримав у дар унікальний човен-довбанку, витесаний із суцільного дуба ще, за переказами, козаками, і тепер його готують до нічної консервації, щоб деревина не розсохлась до завтрашнього відкриття нової зали. Реставратор обережно просочує кожен сантиметр деревини спеціальним розчином, а директор музею світить ліхтариком, читаючи вголос легенду про човен зі старої книги. Робота марудна й повільна, бо поспішати з таким експонатом не можна. Раптом на дні човна, під шаром просочення, виявляється вирізьблений знак, якого не було в жодному з попередніх описів знахідки. Директор музею відкладає книгу і схиляється ближче з лупою. Місто засинає.",
   mafiaWin:"Музей, човен і всю нову залу забрала собі мафія. Мафія перемагає!",
   peacefulWin:"Мафію законсервували разом із човном. Мирні перемагають!"},
  {text:"Клітка відчинена — а звір спить! Невеликий провінційний зоопарк готується до нічного переведення рідкісної рисі в новий, значно просторіший вольєр, збудований коштом небайдужих містян. Ветеринар готує заспокійливе на випадок, якщо тварина злякається переїзду, а доглядачі вистилають дно нового вольєра свіжою соломою. Директор зоопарку особисто наглядає за процесом, бо ця рись — гордість усього закладу і зірка місцевих екскурсій. Коли настає час відчиняти стару клітку, виявляється, що замок на ній хтось уже відкривав сьогодні ввечері, хоча за розкладом доступ мав тільки один доглядач. Рись, тим часом, спокійно спить, не підозрюючи про переполох навколо. Місто засинає.",
   mafiaWin:"Зоопарк, рись і весь новий вольєр забрала собі мафія. Мафія перемагає!",
   peacefulWin:"Мафію приручили і замкнули в старій клітці. Мирні перемагають!"},
  {text:"Маски чекають на карнавальну ніч! Майстерня карнавальних масок дошиває останню партію костюмів до завтрашнього міського фестивалю, паперові маше сохнуть рядами на мотузках, розтягнутих через усю кімнату. Художниця розписує кожну маску вручну, додаючи індивідуальні риси за ескізами замовників. Помічниця клеїть пір'я та блискітки на найпишніші з костюмів, наспівуючи фестивальну пісню наперед. Раптом одна з масок виявляється розписаною геть іншим обличчям, ніж замовляв клієнт — і це обличчя здається художниці підозріло знайомим. Вона довго вдивляється в розпис, намагаючись згадати, де його бачила. Місто засинає.",
   mafiaWin:"Майстерню, маски і весь карнавал забрала собі мафія. Мафія перемагає!",
   peacefulWin:"Мафію розмалювали і здали просто на параді масок. Мирні перемагають!"},
  {text:"Глобус пам'ятає інші кордони! Обласна наукова бібліотека реставрує рідкісний старовинний глобус позаминулого століття, на якому досі позначені країни, яких давно не існує на карті. Реставратор працює над потрісканим лаком поверхні при спеціальному холодному освітленні, щоб не пошкодити фарбу. Бібліотекарка приносить архівні документи про походження глобуса, сподіваючись знайти підказку, як правильно його консервувати. Раптом під однією з наклейок континентів виявляється прихований напис, зроблений явно значно пізніше, ніж виготовили сам глобус. Реставратор обережно підважує краєчок наклейки інструментом. Місто засинає.",
   mafiaWin:"Бібліотеку, глобус і всю колекцію забрала собі мафія. Мафія перемагає!",
   peacefulWin:"Мафію розкрутили на всі континенти і здали бібліотекарці. Мирні перемагають!"},
  {text:"Сніг мусить іти рівно за сценарієм! Обласний театр готує технічну репетицію новорічної вистави, в якій за сюжетом на сцену має падати штучний сніг рівно в момент кульмінації. Реквізитор цілу ніч намагається налаштувати особливу машину, що розсипає дрібно нарізаний папір під потрібним кутом. Освітлювач раз у раз перемикає прожектори, щоб сніг виглядав природно у світлі рампи. Коли нарешті все майже готово, машина видає значно більше снігу, ніж закладено в сценарії, і засипає половину декорацій. Реквізитор розгублено дивиться на важіль керування, який точно ніхто не мав чіпати. Місто засинає.",
   mafiaWin:"Театр, снігову машину і всю виставу забрала собі мафія. Мафія перемагає!",
   peacefulWin:"Мафію засипало снігом і здали освітлювачу. Мирні перемагають!"},
  {text:"Міст мусить витримати ранковий потік! Група інженерів проводить нічну перевірку конструкції нового пішохідного мосту через річку перед завтрашнім урочистим відкриттям, на яке запросили навіть обласне телебачення. Головний інженер обходить кожен зварний шов із приладом для ультразвукового контролю, а помічник записує показники в планшет. Робота відповідальна, бо помилка тут коштуватиме значно дорожче за будь-яку затримку. Раптом прилад фіксує показники в одній із опор, яких там просто не може бути за проєктом. Інженер перепитує показники ще раз, не вірячи першому результату. Місто засинає.",
   mafiaWin:"Міст, урочисте відкриття і всю конструкцію забрала собі мафія. Мафія перемагає!",
   peacefulWin:"Мафію перевірили ультразвуком і зняли з мосту. Мирні перемагають!"},
  {text:"Крос лежить на кроснах ще з вечора! Етнографічне село-музей просто неба проводить майстер-клас із ткацтва при свічках для групи іноземних гостей, які приїхали спеціально подивитись на автентичний процес виготовлення тканини. Майстриня показує, як заправляти нитки основи на старовинних кроснах, а гості по черзі намагаються протягнути човник крізь нитки. Робота йде повільно й напружено, бо кожна помилка означає розпускати весь ряд заново. Раптом посеред тканини виявляється кілька рядів, витканих зовсім іншим візерунком, хоча майстриня присягається, що особисто наглядала за кожним гостем. Місто засинає.",
   mafiaWin:"Село-музей, кросна і всю тканину забрала собі мафія. Мафія перемагає!",
   peacefulWin:"Мафію заткали в тканину і здали на майстер-класі. Мирні перемагають!"},
  {text:"Плівка крутиться востаннє цього століття! Невеликий музей історії кіно реставрує старовинний кіноапарат початку минулого століття, який має вперше за багато десятиліть показати справжній фільм на завтрашньому ретро-показі. Механік розбирає механізм гвинтик за гвинтиком, змащуючи кожну деталь спеціальним маслом. Куратор музею тим часом обережно перемотує крихку плівку, боячись, що вона розсиплеться від найменшого дотику. Коли апарат нарешті збирають і пробують запустити, на екрані з'являються кадри, яких, за словами куратора, у цьому фільмі просто не було. Місто засинає.",
   mafiaWin:"Музей, кіноапарат і весь ретро-показ забрала собі мафія. Мафія перемагає!",
   peacefulWin:"Мафію прокрутили назад і здали куратору. Мирні перемагають!"},
  {text:"Останній човен спускають на воду до світанку! Майстер човнярської справи будує на замовлення точну репліку старовинного рибальського човна для музею просто неба, і сьогодні остання ніч перед тим, як конструкцію мають забрати на випробування водою. Син майстра просмолює шви при світлі багаття на березі, а сам майстер обходить корпус, перевіряючи кожну дошку на щільність прилягання. Робота відповідальна — репліка має бути точною копією знахідки археологів. Раптом в одній із дощок знаходять вирізьблені літери, яких за задумом реставрації там точно не мало бути. Місто засинає.",
   mafiaWin:"Верф, човен і весь музей просто неба забрала собі мафія. Мафія перемагає!",
   peacefulWin:"Мафію просмолили разом з рештою корпусу. Мирні перемагають!"},
  {text:"Рідкісна квітка розквітає раз на життя! Дендропарк проводить нічне чергування біля рідкісної тропічної рослини, яка, за прогнозами ботаніків, має вперше зацвісти цієї ночі — і, можливо, востаннє за десятиліття. Науковці по черзі фотографують бутон кожні пів години, фіксуючи найменші зміни. Сторож парку приносить термос гарячого чаю і теж лишається подивитись на рідкісне видовище. Коли до очікуваного цвітіння лишається зовсім небагато, хтось випадково зачіпає освітлювальну лампу, і вона гасне просто над квіткою в найвідповідальніший момент. Місто засинає.",
   mafiaWin:"Дендропарк, рідкісну квітку і все цвітіння забрала собі мафія. Мафія перемагає!",
   peacefulWin:"Мафію розквітчали і здали просто під об'єктив камери. Мирні перемагають!"},
  {text:"Віск застигає у формі обличчя! Невеликий приватний музей воскових фігур готує нову експозицію місцевих історичних постатей до відкриття, і сьогодні майстер востаннє доопрацьовує риси обличчя головної фігури виставки. Робота ювелірна — кожна зморшка і волосинка мають бути максимально правдоподібними. Помічниця майстра підбирає костюм епохи, звіряючись зі старими портретами в архіві. Раптом виявляється, що обличчя щойно готової фігури виглядає геть інакше, ніж останній ескіз, затверджений музеєм. Майстер довго вдивляється в риси, не розуміючи, коли й як вони змінились. Місто засинає.",
   mafiaWin:"Музей, воскову фігуру і всю виставку забрала собі мафія. Мафія перемагає!",
   peacefulWin:"Мафію розтопили і здали просто в музей. Мирні перемагають!"},
  {text:"Фреска дихає крізь віки! Реставраційна бригада працює над старовинною фрескою в напівзруйнованій сільській церкві, яку громада відновлює власним коштом уже другий рік. Головна реставраторка знімає шар за шаром пізніших перефарбувань, відкриваючи оригінальні кольори під ними. Місцевий священник щовечора заходить подивитись на прогрес і хреститься, бачачи, як обличчя святого поступово проступає з-під століть побілки. Сьогодні, знявши черговий шар, реставраторка виявляє під фрескою напис, якого немає в жодному з церковних літописів. Свічки миготять, а таємниця чекає під останнім шаром фарби. Місто засинає.",
   mafiaWin:"Церкву, фреску і всю громаду забрала собі мафія. Мафія перемагає!",
   peacefulWin:"Мафію розписали на фресці і здали священнику. Мирні перемагають!"},
  {text:"Пелюстки з тканини живіші за справжні! Флористична майстерня готує партію штучних квітів для завтрашнього весільного оформлення заможного клієнта, кожна пелюстка вирізана й розфарбована вручну, щоб виглядати максимально природно. Майстрині працюють за спеціальними трафаретами, передаючи готові квіти одна одній по конвеєру просто на столі. Замовниця весілля наполягла, щоб букет виглядав як справжній, хоча має простояти рік без зів'янення. Раптом один із готових букетів виявляється зібраним геть за іншою схемою кольорів, ніж затверджено в ескізі. Місто засинає.",
   mafiaWin:"Майстерню, букети і все весілля забрала собі мафія. Мафія перемагає!",
   peacefulWin:"Мафію обірвали пелюстка за пелюсткою. Мирні перемагають!"},
  {text:"Кулі надуваються до світанкового старту! Команда повітроплавців готує кілька куль до завтрашнього фестивалю, який щороку збирає глядачів з усієї округи на світанковий масовий політ. Пальники перевіряють цілу ніч, кошики розкладені на траві поруч зі згорнутими оболонками. Головний пілот команди особисто перевіряє кожен трос кріплення, бо від цього залежать життя пасажирів завтрашнього польоту. Раптом на одній з оболонок виявляється надріз, якого там точно не було під час денного огляду. Пілот присвічує ліхтариком ближче, намагаючись зрозуміти, наскільки він небезпечний. Місто засинає.",
   mafiaWin:"Фестиваль, кулі і весь світанковий політ забрала собі мафія. Мафія перемагає!",
   peacefulWin:"Мафію здули і не пустили навіть до кошика. Мирні перемагають!"},
  {text:"Урни ще теплі від денної спеки! Виборча дільниця в маленькому селищі проводить нічний підрахунок голосів після завершення виборів старости, члени комісії розкладають бюлетені стосами під наглядом спостерігачів від обох кандидатів. Голова комісії зачитує кожен бюлетень уголос, а секретар веде протокол. Атмосфера напружена, бо результати передбачають різницю всього в кілька голосів. Раптом в одній з урн виявляється пачка бюлетенів, запечатаних геть іншою печаткою, ніж усі решта. Спостерігачі одночасно підводяться з місць. Місто засинає.",
   mafiaWin:"Дільницю, урни і всі голоси забрала собі мафія. Мафія перемагає!",
   peacefulWin:"Мафію перерахували і визнали недійсною. Мирні перемагають!"},
  {text:"Генератор гуде голосніше за грозу! Районна лікарня втратила електропостачання через нічну грозу, і черговий персонал терміново перемикає найважливіше обладнання на резервний генератор. Медсестри при світлі кишенькових ліхтариків обходять палати, заспокоюючи пацієнтів. Черговий лікар особисто контролює апарати в реанімації, де перебої неприпустимі ні на секунду. Раптом генератор починає давати перебої з живленням саме в той момент, коли це найнебезпечніше. Електрик лікарні біжить до щитової, не розуміючи причини несправності. Місто засинає.",
   mafiaWin:"Лікарню, генератор і все резервне живлення забрала собі мафія. Мафія перемагає!",
   peacefulWin:"Мафію відключили від мережі і здали електрику. Мирні перемагають!"},
  {text:"Двадцять років — а обличчя ті самі! Випускники школи зібрались у актовій залі на вечір зустрічі з нагоди двадцятиріччя випуску, класна керівниця, вже літня жінка, зі сльозами на очах впізнає кожного колишнього учня. На стінах розвішані старі фотографії з випускного, хтось приніс навіть той самий програвач з дискотеки. Розмови точаться про те, хто ким став, а хто досі не змінився. Раптом хтось пригадує стару шкільну історію про зниклий класний журнал — і виявляється, що один з присутніх досі знає, де він. Місто засинає.",
   mafiaWin:"Школу, зустріч і всі спогади забрала собі мафія. Мафія перемагає!",
   peacefulWin:"Мафію залишили на другий рік ще раз. Мирні перемагають!"},
  {text:"Крейда востаннє скрипить по дошці! Улюблена вчителька математики виходить на пенсію після сорока років роботи в сільській школі, і колеги влаштовують їй прощальний вечір просто в шкільному класі, прикрашеному саморобними гірляндами. Учні різних поколінь приходять один за одним подякувати особисто. Директор школи готує урочисту промову, гортаючи нотатки. Раптом виявляється, що подарунок від усього педколективу — старовинний глобус із шкільного кабінету географії — кудись зник із учительської. Місто засинає.",
   mafiaWin:"Школу, клас і всі спогади про вчительку забрала собі мафія. Мафія перемагає!",
   peacefulWin:"Мафію залишили після уроків без права на пенсію. Мирні перемагають!"},
  {text:"Хвилі й прожектор — єдині свідки вахти! Берегова охорона патрулює узбережжя цієї ночі за посиленим графіком через штормове попередження, катер повільно йде вздовж берега, прожектор освітлює кожну бухту. Молодий матрос вперше на нічній вахті і пильно вдивляється в темряву, боячись пропустити щось важливе. Капітан катера раз у раз звіряється з радаром, шукаючи підозрілі сигнали. Раптом радар фіксує невеликий човен там, де за розкладом жодних суден бути не повинно. Місто засинає.",
   mafiaWin:"Берег, катер і всю варту забрала собі мафія. Мафія перемагає!",
   peacefulWin:"Мафію виловили прожектором просто в темряві. Мирні перемагають!"},
  {text:"Мотузки напнуті, скеля чекає світанку! Гірськорятувальний загін приймає на нічні спільні навчання команду колег з сусідньої області, щоб відпрацювати координацію дій перед сезоном сходжень. Інструктори розкладають спорядження при світлі налобних ліхтарів, перевіряючи вузли на мотузках. Керівник навчань роздає завдання по рації командам, розкиданим по різних ділянках схилу. Раптом одна з команд повідомляє по рації, що на позначеному маршруті хтось уже пройшов раніше і залишив дивні позначки. Місто засинає.",
   mafiaWin:"Загін, гори і всі навчання забрала собі мафія. Мафія перемагає!",
   peacefulWin:"Мафію зняли зі скелі мотузкою і здали інструктору. Мирні перемагають!"},
  {text:"Корова мукає голосніше за грозу знадвору! Приватна молочна ферма приймає важкі пологи в найкращої дійної корови господарства просто вночі, ветеринар уже другу годину не відходить від стійла. Господар нервово підносить відра з теплою водою, а найстарший робітник ферми заспокійливо гладить корову по шиї, наспівуючи щось тихе. Пологи складні, і кожна хвилина на рахунку. Раптом хтось із робітників помічає, що двері сусіднього стійла, де тримають бика-плідника, стоять розчинені навстіж. Місто засинає.",
   mafiaWin:"Ферму, корову і все господарство забрала собі мафія. Мафія перемагає!",
   peacefulWin:"Мафію видоїли і зачинили в стійлі. Мирні перемагають!"},
  {text:"Сейф зачинений — а будівля розкрита! Відділення банку в маленькому місті проводить капітальний ремонт, і сейфову кімнату тимчасово охороняють підсилено, поки будівельники розбирають стіни навколо. Охоронець обходить периметр щогодини з ліхтарем, перевіряючи кожен новий отвір у стінах. Прораб будівельної бригади лишився запізно, щоб проконтролювати заливку бетону. Раптом один з будівельних отворів у стіні виявляється значно більшим, ніж передбачає проєкт ремонту. Місто засинає.",
   mafiaWin:"Банк, сейф і весь ремонт забрала собі мафія. Мафія перемагає!",
   peacefulWin:"Мафію замурували в стіні разом з рештою цегли. Мирні перемагають!"},
  {text:"Ялинка чекає на перше запалення вогників! Центральна площа маленького міста готується до відкриття різдвяного ярмарку, робітники монтують останні прикраси на головній ялинці, а власники яток розставляють товар при світлі гірлянд. Мер міста особисто перевіряє, чи все готово до завтрашньої урочистої церемонії запалення вогників. Раптом виявляється, що коробка з головною зіркою для верхівки ялинки, яку привезли спеціально з обласного центру, кудись зникла зі складу. Місто засинає.",
   mafiaWin:"Площу, ярмарок і всю ялинку забрала собі мафія. Мафія перемагає!",
   peacefulWin:"Мафію запалили разом з гірляндами. Мирні перемагають!"},
  {text:"Рейки холодні, а робота гаряча! Ремонтна бригада залізниці працює на перегоні між станціями в єдине технологічне вікно цієї ночі, коли рух поїздів повністю зупинено. Бригадир при світлі прожекторів на спецтехніці перевіряє стан кожної шпали. Робота має бути завершена рівно до відновлення руху о шостій ранку, бо запізнення затримає десятки поїздів. Раптом на одній з ділянок колії виявляється деталь кріплення, якої там взагалі не мало бути за проєктом ремонту. Місто засинає.",
   mafiaWin:"Перегін, бригаду і весь графік руху забрала собі мафія. Мафія перемагає!",
   peacefulWin:"Мафію зняли з колії до відновлення руху. Мирні перемагають!"},
  {text:"Новачок вивчає світло на все життя! Старий доглядач маяка навчає молодого наступника премудростям служби цієї ночі — адже за місяць вихід на пенсію, і хтось повинен продовжити традицію. Новачок записує в блокнот кожну деталь: коли міняти лампу, як читати показники погоди, коли подавати сигнал у туман. Старий доглядач розповідає історії про кораблі, які маяк урятував за десятиліття служби. Раптом обидва помічають у морі сигнал SOS, якого не мало прозвучати за жодним відомим маршрутом суден. Місто засинає.",
   mafiaWin:"Маяк, навчання і всю службу забрала собі мафія. Мафія перемагає!",
   peacefulWin:"Мафію засигналили SOS і здали береговій охороні. Мирні перемагають!"},
  {text:"Прожектори висвітлюють останню репетицію перед прем'єрою! Обласний театр проводить технічну репетицію освітлення напередодні прем'єри нової вистави, головний освітлювач вибудовує кожну сцену окремо, синхронізуючи прожектори з рухами акторів. Режисер сидить у темному залі, вигукуючи вказівки в мікрофон. Робота копітка, бо кожна помилка з освітленням може зіпсувати найважливішу сцену вистави. Раптом один із прожекторів самовільно перемикається на геть іншу сцену, хоча пульт керування ніхто не торкався. Місто засинає.",
   mafiaWin:"Театр, освітлення і всю прем'єру забрала собі мафія. Мафія перемагає!",
   peacefulWin:"Мафію висвітлили прожектором і зняли зі сцени. Мирні перемагають!"},
  {text:"Мед оцінює комісія при свічках! Обласний фестиваль бджільництва проводить урочисту нічну церемонію нагородження кращих пасічників року, золоті медалі вже розкладені на оксамитовій подушечці. Голова журі готує промову, а пасічники нервово чекають результатів біля своїх виставкових стендів з медом. Атмосфера святкова, але напружена — приз цього року особливо престижний. Раптом виявляється, що диплом переможця виписаний на ім'я пасічника, якого взагалі не було серед учасників фестивалю. Місто засинає.",
   mafiaWin:"Фестиваль, медалі і весь мед забрала собі мафія. Мафія перемагає!",
   peacefulWin:"Мафію нагородили і роздягли з медалі. Мирні перемагають!"},
  {text:"Вода прибуває швидше за здоровий глузд! Обласний архів переживає надзвичайну ситуацію — прорвало старій водогінну трубу просто над сховищем найцінніших документів, і весь персонал вночі рятує папери, переносячи їх у сухе приміщення. Архіваріуси працюють ланцюжком, передаючи коробки з рук в руки. Директор архіву особисто контролює, які документи рятувати найпершими за списком цінності. Раптом одна з найважливіших коробок виявляється порожньою, хоча за описом мала містити унікальні документи. Місто засинає.",
   mafiaWin:"Архів, документи і весь рятувальний ланцюжок забрала собі мафія. Мафія перемагає!",
   peacefulWin:"Мафію замочили разом з рештою паперів. Мирні перемагають!"},
  {text:"Охорона обходить об'єкт кожні півгодини! Будівельний майданчик нового житлового комплексу охороняється нічним сторожем, поки триває заливка фундаменту — роботу не можна зупиняти до ранку. Сторож обходить периметр з ліхтариком, перевіряючи, чи все обладнання на місці. Прораб лишився проконтролювати процес особисто, бо від якості заливки залежить уся подальша будова. Раптом сторож помічає, що паркан навколо об'єкта в одному місці розібраний, хоча вдень усе було ціле. Місто засинає.",
   mafiaWin:"Майданчик, фундамент і весь житловий комплекс забрала собі мафія. Мафія перемагає!",
   peacefulWin:"Мафію замурували у фундамент і викрили. Мирні перемагають!"},
  {text:"Дзвінки не змовкають цілу ніч на лінії! Стара телефонна станція маленького міста, де досі працює кілька ручних комутаторів для найвіддаленіших сіл, приймає незвично багато нічних дзвінків через грозу, що обірвала частину нових ліній. Телефоністка перемикає штекери один за одним, з'єднуючи абонентів. Начальник зв'язку лишився допомогти впоратись із напливом викликів. Раптом на лінії з'являється голос, який просить з'єднати з номером, що не існує в жодному довіднику міста. Місто засинає.",
   mafiaWin:"Станцію, лінії і весь зв'язок забрала собі мафія. Мафія перемагає!",
   peacefulWin:"Мафію роз'єднали і більше не передзвонили. Мирні перемагають!"},
  {text:"Посилки складені штабелями до самої стелі! Обласний поштовий хаб приймає рекордну кількість посилок напередодні новорічних свят, сортувальники працюють позмінно, розбираючи гори коробок за адресами. Начальник зміни веде облік найважливіших відправлень з позначкою «терміново». Конвеєрна стрічка не спиняється ні на хвилину. Раптом одна з посилок з позначкою «крихке» виявляється значно важчою, ніж могла б бути за вмістом. Місто засинає.",
   mafiaWin:"Хаб, посилки і всі свята забрала собі мафія. Мафія перемагає!",
   peacefulWin:"Мафію розпакували і здали на пошту. Мирні перемагають!"},
  {text:"Кров рятує життя навіть уночі! Обласна станція переливання крові проводить екстрений нічний забір донорської крові через масштабну аварію на трасі, лікарі та медсестри працюють без перерви, приймаючи охочих здати кров. Координатор станції веде облік груп крові, яких найбільше бракує. Черга з добровольців не рідшає навіть о другій ночі. Раптом один із пакетів з кров'ю виявляється підписаним геть іншою групою, ніж записано в базі донора. Місто засинає.",
   mafiaWin:"Станцію, кров і весь запас забрала собі мафія. Мафія перемагає!",
   peacefulWin:"Мафію здали на аналіз і забракували. Мирні перемагають!"},
  {text:"Оркестр записується наостанок перед ефіром! Обласний аматорський оркестр записує нічну сесію в студії місцевого радіо для завтрашньої святкової трансляції, звукорежисер розставляє мікрофони навколо кожної групи інструментів. Диригент вимагає ідеальної тиші між дублями, бо запис прямий і без монтажу. Раптом на записі одного з дублів чути звук, якого в оркестрі просто не мало бути — ніхто не грає на цьому інструменті. Місто засинає.",
   mafiaWin:"Студію, запис і весь ефір забрала собі мафія. Мафія перемагає!",
   peacefulWin:"Мафію записали і вирізали монтажем. Мирні перемагають!"},
  {text:"Рій гуде голосніше за сирену! Пасічник виявляє посеред ночі, що величезний рій бджіл покинув один з вуликів і осів на старому дереві біля сусіднього двору, і терміново кличе на допомогу досвідченого колегу, поки рій не полетів далі. Удвох вони обережно підставляють спеціальний ящик під гілку, намагаючись не дратувати бджіл зайвим світлом. Сусіди виглядають у вікна, стривожені незвичним гудінням. Раптом виявляється, що матка рою мічена геть іншим кольором, ніж повинна бути за записами пасіки. Місто засинає.",
   mafiaWin:"Рій, пасіку і всіх бджіл забрала собі мафія. Мафія перемагає!",
   peacefulWin:"Мафію пересадили в ящик і закрили кришкою. Мирні перемагають!"},
  {text:"Наметовий табір гуде дитячими голосами навіть після відбою! Школа влаштовує для випускного класу нічний табір-ночівлю просто в спортзалі як прощальну традицію перед випускними іспитами, вчителі чергують позмінно, стежачи за порядком. Діти шепочуться в спальних мішках, розповідаючи страшилки при світлі ліхтариків з телефонів. Класний керівник кілька разів заходить призвати всіх до тиші. Раптом хтось помічає, що один зі спальних мішків порожній, хоча хвилину тому там точно хтось лежав. Місто засинає.",
   mafiaWin:"Спортзал, табір і весь випускний клас забрала собі мафія. Мафія перемагає!",
   peacefulWin:"Мафію знайшли в сусідньому спальнику. Мирні перемагають!"},
  {text:"Багаття горять уздовж усього виноградника! Несподіване весняне похолодання загрожує знищити цвіт на виноградній лозі буквально за одну ніч, і власник виноградника терміново скликає всіх сусідів розпалити багаття та димові шашки вздовж рядів, щоб урятувати врожай теплим димом. Робота триває до самого світанку, всі по черзі підкидають дрова, стежачи, щоб дим стелився рівномірно. Раптом один з рядів лози виявляється взагалі не прикритим димом, хоча за графіком чергування там мав бути відповідальний. Місто засинає.",
   mafiaWin:"Виноградник, урожай і весь захист від морозу забрала собі мафія. Мафія перемагає!",
   peacefulWin:"Мафію обкурили димом і зігнали з рядів. Мирні перемагають!"},
  {text:"Пара стелиться над лазнею цілу ніч! Сільська громадська лазня готується до традиційного банного вечора перед великим святом, кочегар підтримує вогонь у печі з самого вечора, щоб каміння розжарилось до потрібної температури. Жінки готують віники з дубового й березового листя, заготовленого ще влітку. Атмосфера тепла й дружня, розмови точаться про майбутнє свято. Раптом виявляється, що хтось підкинув у пічку дров значно більше, ніж треба, і температура зростає до небезпечної позначки. Місто засинає.",
   mafiaWin:"Лазню, пару і все свято забрала собі мафія. Мафія перемагає!",
   peacefulWin:"Мафію попарили віником і вигнали з лазні. Мирні перемагають!"},
  {text:"Ефір чекає на розгадку столітньої таємниці! Нічне ток-шоу місцевого радіо запросило в студію краєзнавця обговорити стару міську легенду про скарб, нібито захований десь під ратушею ще за австрійських часів. Телефонна лінія розжарена від дзвінків радіослухачів, кожен ділиться власною версією історії. Ведуча ледве встигає перемикати дзвінки один за одним. Раптом у прямому ефірі лунає дзвінок від людини, яка стверджує, що знає точне місце — і одразу вішає слухавку. Місто засинає.",
   mafiaWin:"Студію, легенду і весь скарб забрала собі мафія. Мафія перемагає!",
   peacefulWin:"Мафію викрили прямо в ефірі. Мирні перемагають!"},
  {text:"Гребля тримає воду вже півстоліття! Інспектори проводять позаплановий нічний огляд старої греблі водосховища після кількаденних проливних дощів, рівень води піднявся до позначки, якої не бачили роками. Головний інженер обходить кожен метр бетонної конструкції з приладом контролю тиску води. Місцеві мешканці нижче за течією стежать за новинами з тривогою. Раптом прилад фіксує показники тиску в одній з ділянок греблі, яких там просто не повинно бути. Місто засинає.",
   mafiaWin:"Греблю, водосховище і все село нижче за течією забрала собі мафія. Мафія перемагає!",
   peacefulWin:"Мафію змило переливом через греблю. Мирні перемагають!"},
  {text:"Лялька дивиться очима, яких вчора не було! Майстер-ляльковик готує унікальну авторську ляльку на замовлення колекціонера з-за кордону, розписуючи порцелянове обличчя найтоншим пензлем під збільшувальним склом. Робота вимагає ідеальної нерухомості руки, тому майстер працює лише вранці та вночі, коли найспокійніше. Помічниця готує костюм ляльки з найдорожчого мережива. Раптом виявляється, що щойно розписане обличчя ляльки виглядає геть інакше, ніж останній ескіз, затверджений замовником. Місто засинає.",
   mafiaWin:"Майстерню, ляльку і все замовлення забрала собі мафія. Мафія перемагає!",
   peacefulWin:"Мафію розписали порцеляновим личком і здали колекціонеру. Мирні перемагають!"},
  {text:"Свято врожаю чекає на головний коровай! Сільський клуб готує святкування Дня врожаю просто на майдані, жінки місять тісто для найбільшого короваю сезону ще з вечора, щоб він встиг вистоятись і випектись до ранку. Піч розпалена особливим способом, який знає тільки найстарша господиня села. Музиканти репетирують у сусідній кімнаті мелодію для завтрашнього виходу короваю. Раптом виявляється, що хтось підмінив борошно в мішку на щось геть інше. Місто засинає.",
   mafiaWin:"Клуб, коровай і все свято врожаю забрала собі мафія. Мафія перемагає!",
   peacefulWin:"Мафію замісили в тісто і випекли в короваї. Мирні перемагають!"},
  {text:"Місток фарбують до параду вишиванок! Громада маленького міста фарбує старий пішохідний місток через струмок у яскраві кольори напередодні завтрашнього параду вишиванок, який щороку збирає учасників з усієї округи. Робота кипить при світлі переносних ламп, пензлі не встигають висихати. Голова оргкомітету звіряє список кольорів із затвердженим ескізом прикраси міста. Раптом половина мостка виявляється пофарбованою в геть інші кольори, ніж узгоджено з архітектором. Місто засинає.",
   mafiaWin:"Місток, парад і все місто забрала собі мафія. Мафія перемагає!",
   peacefulWin:"Мафію пофарбували і здали на параді вишиванок. Мирні перемагають!"},
  {text:"Жорна крутяться під шум води всю ніч! Старий водяний млин на околиці села мелює зерно для завтрашньої випічки цілого району — сучасні млини стоять на ремонті, і тільки цей, дідівський, ще працює справно. Мірошник підсипає зерно в лійку рівномірними жменями, стежачи за швидкістю потоку води на греблі. Син мірошника носить мішки з готовим борошном до підводи, що чекає біля дверей. Робота монотонна й заспокійлива, супроводжувана лише плюскотом води й рівномірним скрипом жорен. Раптом жорна починають молоти з дивним стукотом, якого тут не чули роками, і мірошник терміново зупиняє механізм, щоб перевірити, що потрапило всередину. Місто засинає.",
   mafiaWin:"Млин, жорна і все борошно району забрала собі мафія. Мафія перемагає!",
   peacefulWin:"Мафію змололи разом із зерном. Мирні перемагають!"},
  {text:"Лід ще зимовий, а спека вже літня в планах! Стара льодовня при маєтку, яку місцевий ентузіаст відновлює як музейний експонат, приймає останню партію природного льоду, заготовленого взимку на ставку — за старою технологією так зберігали продукти ще до появи холодильників. Робітники перекладають брили лід соломою шар за шаром у глибокому льоху, щоб він протримався до самого літа. Ентузіаст веде докладний щоденник спостережень за температурою всередині сховища. Раптом виявляється, що частина найбільших брил льоду підозріло швидко тане, хоча солома викладена за всіма правилами. Місто засинає.",
   mafiaWin:"Льодовню, лід і весь музейний проєкт забрала собі мафія. Мафія перемагає!",
   peacefulWin:"Мафію заморозили в льоду до самого літа. Мирні перемагають!"},
  {text:"Крила вітряка ще пам'ятають старі жнива! Реставратор старовинного вітряка поспішає закінчити ремонт крил млина до завтрашнього фестивалю техніки, на який з'їдуться шанувальники старовинних механізмів з усієї області. Тесляр підганяє нову дерев'яну лопать замість трухлявої, звіряючись зі старими кресленнями, знайденими на горищі. Вітер тим часом починає підійматись, обіцяючи ідеальну погоду для завтрашнього запуску. Раптом виявляється, що одна з готових лопатей закріплена під геть іншим кутом, ніж передбачають креслення, і вітряк може розбалансуватись на швидкості. Місто засинає.",
   mafiaWin:"Вітряк, фестиваль техніки і всі крила забрала собі мафія. Мафія перемагає!",
   peacefulWin:"Мафію розкрутило на лопатях і скинуло з вітряка. Мирні перемагають!"},
  {text:"Зорі проєктуються на купол цілу ніч! Обласний планетарій готує спеціальний нічний показ для переможців олімпіади з астрономії — унікальну програму, яку раніше ніколи не демонстрували глядачам. Оператор проєкційного апарата налаштовує кожне сузір'я з ювелірною точністю, звіряючись із картою неба. Методистка розкладає програмки й перевіряє мікрофон для супроводу програми. Робота відповідальна, бо на показ запрошено навіть представників обласного управління освіти. Раптом апарат починає проєктувати сузір'я, яких немає в жодному із затверджених для показу файлів. Місто засинає.",
   mafiaWin:"Планетарій, купол і всю програму забрала собі мафія. Мафія перемагає!",
   peacefulWin:"Мафію спроєктували на купол і викрили при світлі зірок. Мирні перемагають!"},
  {text:"Яблука дають сік просто на очах! Невелика сидровиробня переробляє останню партію осінніх яблук на традиційний сидр, преса вичавлює сік у дерев'яні цебра під рівномірний скрип механізму. Господар цідить перший сік на пробу, оцінюючи кислотність на смак. Робітники завантажують нову партію яблук у лоток пресу, поки попередня ще бродить у бочках поруч. Раптом одна з бочок із суслом, що вже мала б активно бродити, виявляється абсолютно тихою й нерухомою. Місто засинає.",
   mafiaWin:"Сидровиробню, преси і весь урожай яблук забрала собі мафія. Мафія перемагає!",
   peacefulWin:"Мафію віджали разом із рештою яблук. Мирні перемагають!"},
  {text:"Мотор глохне саме тоді, коли найпотрібніший! Механізатор фермерського господарства терміново ремонтує трактор просто в полі при світлі фар іншої машини — сівба має початись рівно завтра вранці, і затримка неприпустима. Син механізатора подає інструменти, а сам голова господарства нервово прогулюється поруч, поглядаючи на небо, що обіцяє дощ післязавтра. Робота йде повільно, бо несправність виявляється хитрішою, ніж здавалось спочатку. Раптом під капотом знаходять деталь, якої там просто не мало бути за жодною схемою цієї моделі трактора. Місто засинає.",
   mafiaWin:"Трактор, поле і всю весняну сівбу забрала собі мафія. Мафія перемагає!",
   peacefulWin:"Мафію завели з полбутовки і виорали разом з полем. Мирні перемагають!"},
  {text:"Помідори червоніють просто під нічними лампами! Тепличний комплекс збирає нічний урожай стиглих помідорів, щоб устигнути привезти найсвіжіший товар на ранковий міський ринок раніше за конкурентів. Робітниці рухаються рядами між грядками з кошиками, зриваючи лише повністю дозрілі плоди. Бригадирка веде облік ваги з кожного ряду теплиці. Раптом в одному з рядів виявляється кущ, обірваний геть не за графіком збору, хоча туди сьогодні ще ніхто не мав заходити. Місто засинає.",
   mafiaWin:"Теплицю, урожай і весь ранковий ринок забрала собі мафія. Мафія перемагає!",
   peacefulWin:"Мафію зірвали недостиглою і здали на ринок. Мирні перемагають!"},
  {text:"Зерно чекає на останній зважування перед відправкою! Елеватор проводить нічну перевірку якості партії зерна перед завтрашньою відвантаженням на експорт, лаборант бере проби з кожного силосу на вологість і засміченість. Начальник зміни звіряє показники з міжнародними стандартами якості, бо партія йде за кордон. Робота йде під невпинний гул вентиляційних систем елеватора. Раптом один із силосів видає показники вологості, які просто неможливі для зерна, що зберігалось за всіма правилами. Місто засинає.",
   mafiaWin:"Елеватор, зерно і весь експортний контракт забрала собі мафія. Мафія перемагає!",
   peacefulWin:"Мафію провіяли разом із половою. Мирні перемагають!"},
  {text:"Стайня пахне свіжою соломою перед показом! Кінноспортивний клуб готує стайню до завтрашніх показових виступів, на які запрошено суддів із самої столиці, конюхи застеляють кожен денник свіжою соломою і начищають упряж до блиску. Головний тренер клубу востаннє прокручує в голові послідовність номерів програми. Робота копітка, бо перше враження суддів складається саме з вигляду стайні. Раптом в одному з денників виявляється кінь, якого там точно не мало бути за розкладом розміщення. Місто засинає.",
   mafiaWin:"Стайню, показові виступи і весь клуб забрала собі мафія. Мафія перемагає!",
   peacefulWin:"Мафію осідлали і зняли з показових виступів. Мирні перемагають!"},
  {text:"Пліт готовий пливти проти течії власної долі! Команда ентузіастів будує традиційний дерев'яний пліт для завтрашніх річкових перегонів, які щороку влаштовує місто на честь давньої сплавної традиції лісосплаву. Колоди зв'язуються міцними канатами за старовинною технологією, яку показав місцевий дід, що сам колись сплавляв ліс. Робота триває при світлі багаття на березі, щоб устигнути до ранкового старту. Раптом одна з колод у готовій конструкції виявляється підпиляною майже наскрізь. Місто засинає.",

/* ---------------- state ---------------- */
const SETTINGS_KEY = 'mafiaHostSettings_v1';
const GAME_KEY = 'mafiaHostGame_v1';
const UNDO_KEY = 'mafiaHostUndo_v1';
let undoStack = [];
function pushUndo(){
  try{
    undoStack.push(JSON.stringify({screen: state.screen, game: state.game}));
    if(undoStack.length>60) undoStack = undoStack.slice(-60);
    localStorage.setItem(UNDO_KEY, JSON.stringify(undoStack));
  }catch(e){}
}
function universalGoBack(){
  if(!undoStack.length) return;
  const raw = undoStack.pop();
  try{ localStorage.setItem(UNDO_KEY, JSON.stringify(undoStack)); }catch(e){}
  let snap;
  try{ snap = JSON.parse(raw); }catch(e){ return; }
  stopTimer();
  state.screen = snap.screen;
  state.game = snap.game;
  saveGame();
  render();
}

function defaultSettings(){
  return {
    playerCount:15,
    direction:'cw',
    roles: JSON.parse(JSON.stringify(DEFAULT_ROLES)),
    nightOrder: JSON.parse(JSON.stringify(DEFAULT_NIGHT_ORDER)),
    timers:{ speech:60, voteSpeech:20, repeatSpeech:20, balagan:60, balaganWhen:'after_defense', lastWord:30 },
    customNotes:'',
    themeLength:'short',
    stats:{black:0, red:0, maniac:0, draws:0},
  };
}
function loadSettings(){
  try{
    const raw = localStorage.getItem(SETTINGS_KEY);
    if(!raw) return defaultSettings();
    const parsed = JSON.parse(raw);
    const d = defaultSettings();
    const merged = Object.assign(d, parsed);
    if(merged.timers){
      if(merged.timers.balaganWhen==='before') merged.timers.balaganWhen='before_defense';
      if(merged.timers.balaganWhen==='after') merged.timers.balaganWhen='after_defense';
    }
    // migration: drop stray plain role ids for don/mafia/zlodiy, ensure structural steps present
    if(Array.isArray(merged.nightOrder)){
      merged.nightOrder = merged.nightOrder.filter(id=>!['don','mafia','zlodiy'].includes(id));
      ['mafia_kill','don_check','zlodiy_block'].forEach(id=>{
        if(!merged.nightOrder.includes(id)) merged.nightOrder.unshift(id);
      });
    }
    // migration: add any new default roles the saved settings predate (e.g. courtesan)
    if(Array.isArray(merged.roles)){
      DEFAULT_ROLES.forEach(defRole=>{
        const existing = merged.roles.find(r=>r.id===defRole.id);
        if(!existing){
          const insertBefore = merged.roles.findIndex(r=>r.id==='peaceful');
          const copy = JSON.parse(JSON.stringify(defRole));
          if(insertBefore>=0) merged.roles.splice(insertBefore, 0, copy);
          else merged.roles.push(copy);
        } else if(defRole.teamChoice && !existing.teamChoice){
          existing.teamChoice = true;
          existing.blocker = !!defRole.blocker;
        }
      });
    }
    if(typeof merged.customNotes !== 'string') merged.customNotes = '';
    if(!merged.stats || typeof merged.stats !== 'object') merged.stats = {black:0, red:0, maniac:0, draws:0};
    ['black','red','maniac','draws'].forEach(k=>{ if(typeof merged.stats[k] !== 'number') merged.stats[k] = 0; });
    return merged;
  }catch(e){ return defaultSettings(); }
}
function saveSettings(){ try{ localStorage.setItem(SETTINGS_KEY, JSON.stringify(state.settings)); }catch(e){} }
function saveGame(){ try{ localStorage.setItem(GAME_KEY, JSON.stringify(state.game)); }catch(e){} }
function clearGame(){ try{ localStorage.removeItem(GAME_KEY); }catch(e){} }

let state = {
  settings: loadSettings(),
  screen: 'setup', // setup | assign | theme | night | day | end
  game: null,
};

/* try resume game */
const KNOWN_SCREENS = ['theme','immunity','acquaint','night','night-summary','day','end'];
(function tryResume(){
  try{
    const raw = localStorage.getItem(GAME_KEY);
    if(raw){
      const g = JSON.parse(raw);
      const scr = g && g.screen;
      if(g && g.players && g.players.length && KNOWN_SCREENS.includes(scr)){
        state.game = g;
        state.screen = (scr==='night-summary') ? 'night' : scr;
      } else {
        localStorage.removeItem(GAME_KEY);
      }
    }
  }catch(e){}
})();

(function tryResumeUndo(){
  try{
    const raw = localStorage.getItem(UNDO_KEY);
    if(raw){
      const arr = JSON.parse(raw);
      if(Array.isArray(arr)) undoStack = arr;
    }
  }catch(e){}
  if(!state.game){ undoStack = []; try{ localStorage.removeItem(UNDO_KEY); }catch(e){} }
})();

/* ---------------- helpers ---------------- */
function el(html){ const t=document.createElement('template'); t.innerHTML=html.trim(); return t.content.firstChild; }
function activeRoles(){ return state.settings.roles.filter(r=>r.active); }
function totalRoleCount(){ return state.settings.roles.reduce((s,r)=>s+Number(r.count||0),0); }
function roleById(id){ return state.settings.roles.find(r=>r.id===id); }
function stepLabelFor(id){ return STEP_LABEL[id] || (roleById(id) ? roleById(id).name : id); }
function shuffle(arr){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

function phaseLabelFor(){
  if(state.screen==='night' && state.game) return `Ніч ${state.game.round}`;
  if(state.screen==='day' && state.game) return `День ${state.game.round}`;
  if(state.screen==='history') return 'Історія гри';
  if(state.screen==='notes') return 'Мої підказки';
  if(state.screen==='rules') return 'Правила';
  if(state.screen==='stats') return 'Статистика';
  if(state.screen==='roledeal') return 'Роздати ролі';
  if(state.screen==='immunity') return 'Імунітет';
  return {
    setup:'Налаштування', theme:'Тема гри',
    acquaint:'Ніч знайомства', night:'Ніч', day:'День', end:'Гра завершена'
  }[state.screen] || '';
}

function render(){
  document.getElementById('phaseLabel').textContent = phaseLabelFor();
  const root = document.getElementById('screens');
  root.innerHTML = '';
  const nav = document.getElementById('navBar');
  nav.innerHTML = '';
  if(state.screen==='setup') renderSetup(root, nav);
  else if(state.screen==='theme') renderTheme(root, nav);
  else if(state.screen==='immunity') renderImmunity(root, nav);
  else if(state.screen==='acquaint') renderAcquaint(root, nav);
  else if(state.screen==='night') renderNight(root, nav);
  else if(state.screen==='day') renderDay(root, nav);
  else if(state.screen==='end') renderEnd(root, nav);
}

/* ================= SETUP SCREEN ================= */
function recalcPeaceful(){
  const s = state.settings;
  const peaceful = s.roles.find(r=>r.id==='peaceful');
  if(!peaceful) return;
  const others = s.roles.filter(r=>r.id!=='peaceful').reduce((sum,r)=>sum+Number(r.count||0),0);
  peaceful.count = Math.max(0, s.playerCount - others);
  peaceful._overflow = Math.max(0, others - s.playerCount);
}

    orderRows.push(row);
  });

  orderRows.forEach((row, startIdx)=>{
    let drag = null;
    row.addEventListener('pointerdown', (e)=>{
      if(orderRows.length<2) return;
      const rowHeight = row.getBoundingClientRect().height;
      drag = { startY: e.clientY, rowHeight, from: startIdx, target: startIdx };
      row.setPointerCapture(e.pointerId);
      row.style.zIndex = '5';
      row.style.transition = 'none';
      row.style.boxShadow = '0 6px 18px rgba(0,0,0,.5)';
      orderRows.forEach(r=>{ if(r!==row) r.style.transition = 'transform 140ms ease'; });
    });
    row.addEventListener('pointermove', (e)=>{
      if(!drag) return;
      const deltaY = e.clientY - drag.startY;
      row.style.transform = `translateY(${deltaY}px)`;
      let shift = Math.round(deltaY / drag.rowHeight);
      let target = Math.max(0, Math.min(orderRows.length-1, drag.from + shift));
      if(target !== drag.target){
        drag.target = target;
        orderRows.forEach((r, i)=>{
          if(i===drag.from) return;
          let off = 0;
          if(drag.target > drag.from && i>drag.from && i<=drag.target) off = -drag.rowHeight;
          else if(drag.target < drag.from && i>=drag.target && i<drag.from) off = drag.rowHeight;
          r.style.transform = off ? `translateY(${off}px)` : '';
        });
      }
    });
    function endDrag(e){
      if(!drag) return;
      const finalTarget = drag.target;
      const from = drag.from;
      orderRows.forEach(r=>{ r.style.transform=''; r.style.transition=''; r.style.boxShadow=''; r.style.zIndex=''; });
      if(finalTarget !== from){

        s.nightOrder.splice(finalTarget,0,item);

      render();

  card5.appendChild(notesArea);
  root.appendChild(card5);

  // start button

}

function startGame(){
  const s = state.settings;
  const players = [];
  for(let i=1;i<=s.playerCount;i++){
    players.push({ number:i, roleId:null, alive:true });
  }
  state.game = {
    screen:'immunity',
    players,
    round:1,
    theme:null,
    lastZlodiyTarget:null,
    lastDoctorTarget:null,
    log:[],
    nightResult:null,
    immunePlayer:null,
  };
  state.screen = 'immunity';
  saveGame();
  render();
}

/* ================= THEME SCREEN ================= */

  return THEMES_SHORT;
}

  root.appendChild(el(`<div class="night-banner">Скажи гравцям: коло промов рухається <b>${dirLabel}</b>. Першим сьогодні говорить гравець №1.</div>`));

    <h3>Тема гри</h3>
    <div class="segmented" style="margin-bottom:10px;">
      <button class="small themeLenBtn ${state.settings.themeLength==='short'?'active':''}" data-v="short">Короткі</button>
      <button class="small themeLenBtn ${state.settings.themeLength==='medium'?'active':''}" data-v="medium">Середні</button>

    <button class="small ghost" id="rerollTheme">↻ Інша тема</button>

  root.appendChild(card);
  card.querySelectorAll('.themeLenBtn').forEach(b=>{
    b.addEventListener('click', ()=>{
      state.settings.themeLength = b.dataset.v;
      saveSettings();
      const newArr = getThemesArray();
      g.theme = newArr[Math.floor(Math.random()*newArr.length)];
      saveGame();
      render();
    });
  });
  card.querySelector('#rerollTheme').addEventListener('click', ()=>{
    const arr2 = getThemesArray();
    let t;
    do{ t = arr2[Math.floor(Math.random()*arr2.length)]; }while(t===g.theme && arr2.length>1);
    g.theme = t;
    saveGame();
    card.querySelector('#themeText').textContent = t.text;
  });
  const navWrap = el(`<div class="app-nav"></div>`);

  nav.appendChild(navWrap);

/* ================= IMMUNITY SCREEN ================= */
function hasImmunity(playerNumber){
  const g = state.game;
  return g && g.immunePlayer===playerNumber && g.round<=2;
}
function renderImmunity(root, nav){
  const g = state.game;
  if(g.immuneSelection===undefined) g.immuneSelection = null;
  root.appendChild(el(`<div class="card">

    <div class="muted">Обери одного гравця, який матиме імунітет у першому раунді: День 1, Ніч 2 і День 2. Його не можна ні вбити, ні виставити на голосування. Ознайомча ніч у цей раунд не входить.</div>
  </div>`));
  const card = el(`<div class="card"></div>`);
  const grid = el(`<div class="player-grid"></div>`);
  g.players.forEach(p=>{
    const btn = el(`<button class="player-btn ${g.immuneSelection===p.number?'selected':''}">${p.number}</button>`);
    btn.addEventListener('click', ()=>{
      g.immuneSelection = (g.immuneSelection===p.number) ? null : p.number;

  const navWrap = el(`<div class="app-nav"></div>`);

  const skip = el(`<button class="ghost">Без імунітету</button>`);

    pushUndo();
    g.immunePlayer = null;

    g.screen = 'theme';
    saveGame();
    render();

    render();

  navWrap.appendChild(back);
  navWrap.appendChild(skip);
  navWrap.appendChild(next);
  nav.appendChild(navWrap);
}

/* ================= ACQUAINTANCE NIGHT — host records who has which role ================= */
function buildAssignSteps(){
  const s = state.settings;
  const don = roleById('don'), mafia = roleById('mafia'), zlodiy = roleById('zlodiy');
  const steps = [];
  s.nightOrder.forEach(stepId=>{
    if(stepId==='mafia_kill'){
      const need = (mafia?mafia.count:0) + (don?don.count:0);
      if(need>0) steps.push({stepId, need, kind:'black_group', label:'Мафія та Дон'});
    } else if(stepId==='don_check'){
      const need = don?don.count:0;
      if(need>0) steps.push({stepId, need, kind:'don_pick', label:'Дон (хто саме)'});
    } else if(stepId==='zlodiy_block'){
      const need = zlodiy?zlodiy.count:0;
      if(need>0) steps.push({stepId, need, kind:'simple', roleId:'zlodiy', label:'Злодій'});
    } else {
      const r = roleById(stepId);
      if(r && r.count>0) steps.push({stepId, need:r.count, kind:'simple', roleId:stepId, label:r.name});
    }
  });
  return steps;
}
function beginAcquaintance(){

/* ================= NIGHT LOGIC ================= */
function alivePlayers(){ return state.game.players.filter(p=>p.alive); }
function computeWinner(){
  const alive = alivePlayers();
  const blackCount = alive.filter(p=>{ const r=roleById(p.roleId); return r && r.team==='black'; }).length;
  const redCount = alive.filter(p=>{ const r=roleById(p.roleId); return r && r.team==='red'; }).length;
  const maniacRole = roleById('maniac');
  if(maniacRole && maniacRole.team==='neutral'){
    const maniacAlive = alive.some(p=>p.roleId==='maniac');
    if(maniacAlive && blackCount===1 && redCount===1) return 'maniac';
  }
  if(blackCount===0) return 'red';
  if(blackCount>=redCount) return 'black';
  return null;
}
function playersWithRole(roleId){ return alivePlayers().filter(p=>p.roleId===roleId); }
function blackTeamAlive(){ return alivePlayers().filter(p=>{ const r=roleById(p.roleId); return r && r.team==='black'; }); }

function anyPlayersWithRole(roleId){ return state.game.players.filter(p=>p.roleId===roleId); }
function beginNight(){
  const g = state.game;
  const order = state.settings.nightOrder.slice();
  const steps = [];
  order.forEach(stepId=>{
    if(stepId==='mafia_kill'){
      if(blackTeamAlive().length>0) steps.push({id:'mafia_kill'});
    } else if(stepId==='don_check'){
      const don = anyPlayersWithRole('don');
      const sheriffRole = roleById('sheriff');
      if(don.length>0 && sheriffRole && sheriffRole.count>0) steps.push({id:'don_check', actor:don[0]});
    } else if(stepId==='zlodiy_block'){
      const z = anyPlayersWithRole('zlodiy');
      if(z.length>0){
        const isLast = blackTeamAlive().length===1 && blackTeamAlive()[0].number===z[0].number;
        steps.push({id: isLast?'zlodiy_kill':'zlodiy_block', actor:z[0]});
      }
    } else {
      const actors = anyPlayersWithRole(stepId);
      if(actors.length>0) steps.push({id:stepId, actor:actors[0]});
    }
  });
  g.nightSteps = steps;
  g.nightStepIndex = -1;
  g.nightBlockedNumbers = [];
  g.nightResults = { mafiaVictim:null, maniacVictim:null, savedNumber:null, zlodiyKillVictim:null, checks:[] };
  g.nightHistory = [];
  g.screen = 'night';
  state.screen = 'night';
  g.nightSelection = [];
  advanceNightStep();
}

function advanceNightStep(){
  const g = state.game;
  g.nightStepIndex++;
  g.nightSelection = [];
  saveGame();
  if(g.nightStepIndex >= g.nightSteps.length){
    finishNight();
    return;
  }
  render();
}


function currentStep(){
  const g = state.game;
  if(g.nightStepIndex<0 || g.nightStepIndex>=g.nightSteps.length) return null;
  return g.nightSteps[g.nightStepIndex];
}

function stepNeedsSkip(step){
  // a block affects red-team active roles only
  const g = state.game;
  if(!step.actor) return false;
  if(['mafia_kill','zlodiy_block','zlodiy_kill'].includes(step.id)) return false;
  if((g.nightBlockedNumbers||[]).includes(step.actor.number)){
    const r = roleById(step.actor.roleId);
    if(r && r.team==='red' && r.active) return true;
  }
  return false;
}

function nightTransitionText(index){

  const currentName = wakeRoleName(stepId);

  if(index===0) return `Місто засинає. Прокидається ${currentName}${clause}.`;
  const prevName = wakeRoleName(g.nightSteps[index-1].id);

function liveCheckHint(step, selection){
  const need = step.id==='journalist' ? 2 : 1;
  if(!selection || selection.length < need) return null;
  const g = state.game;
  if(step.id==='don_check'){
    const t = g.players.find(p=>p.number===selection[0]);
    const isSheriff = t && t.roleId==='sheriff';
    return `Якщо підтвердиш: скажи Дону наодинці — гравець №${selection[0]} ${isSheriff?'це Шериф':'не Шериф'}.`;
  }
  if(step.id==='sheriff'){
    const t = g.players.find(p=>p.number===selection[0]);
    const r = roleById(t.roleId);
    const color = r && r.team==='black' ? 'чорний' : 'червоний';
    return `Якщо підтвердиш: скажи Шерифу наодинці колір гравця №${selection[0]} — ${color}.`;
  }
  if(step.id==='journalist'){
    const t1 = g.players.find(p=>p.number===selection[0]);
    const t2 = g.players.find(p=>p.number===selection[1]);
    const r1 = roleById(t1.roleId), r2 = roleById(t2.roleId);
    const same = r1 && r2 && r1.team===r2.team;
    return same
      ? `Якщо підтвердиш: покажи Журналісту два пальці в одному напрямку — гравці однієї команди.`
      : `Якщо підтвердиш: покажи Журналісту один палець вгору, один вниз — гравці різних команд.`;
  }
  return null;
}

function getForbiddenTarget(step){
  const g = state.game;
  if(step.id==='zlodiy_block') return g.lastZlodiyTarget;
  if(step.id==='courtesan') return g.lastCourtesanTarget;
  if(step.id==='doctor') return g.lastDoctorTarget;
  return null;
}

function recordStepResult(step, selection){
  const g = state.game;
  const res = g.nightResults;
  g.nightBlockedNumbers = g.nightBlockedNumbers || [];
  if(step.id==='mafia_kill'){
    res.mafiaVictim = selection ? selection[0] : null;
  } else if(step.id==='don_check'){
    if(selection){
      const target = g.players.find(p=>p.number===selection[0]);
      const isSheriff = target && target.roleId==='sheriff';
      res.checks.push({type:'don', target:selection[0], result: isSheriff});
    }
  } else if(step.id==='zlodiy_block'){
    if(selection){ g.nightBlockedNumbers.push(selection[0]); }
    g.lastZlodiyTarget = selection ? selection[0] : null;
  } else if(step.id==='courtesan'){
    if(selection){ g.nightBlockedNumbers.push(selection[0]); }
    g.lastCourtesanTarget = selection ? selection[0] : null;
  } else if(step.id==='zlodiy_kill'){
    res.zlodiyKillVictim = selection ? selection[0] : null;
  } else if(step.id==='maniac'){
    res.maniacVictim = selection ? selection[0] : null;
  } else if(step.id==='doctor'){
    res.savedNumber = selection ? selection[0] : null;
    g.lastDoctorTarget = selection ? selection[0] : null;
  } else if(step.id==='sheriff'){
    if(selection){
      const target = g.players.find(p=>p.number===selection[0]);
      const r = roleById(target.roleId);
      res.checks.push({type:'sheriff', target:selection[0], result: r ? r.team : null});
    }
  } else if(step.id==='journalist'){
    if(selection && selection.length===2){
      const t1 = g.players.find(p=>p.number===selection[0]);
      const t2 = g.players.find(p=>p.number===selection[1]);
      const r1 = roleById(t1.roleId), r2 = roleById(t2.roleId);
      res.checks.push({type:'journalist', targets:selection, sameTeam: r1 && r2 ? (r1.team===r2.team) : null});
    }
  }
  saveGame();
}

function finishNight(){
  const g = state.game;
  const res = g.nightResults;
  const blocked = g.nightBlockedNumbers || [];

  // safety net: the immune player can't die even if somehow targeted
  if(g.round<=2 && g.immunePlayer!=null){
    if(res.mafiaVictim===g.immunePlayer) res.mafiaVictim = null;
    if(res.maniacVictim===g.immunePlayer) res.maniacVictim = null;
    if(res.zlodiyKillVictim===g.immunePlayer) res.zlodiyKillVictim = null;
  }

  // if a block hit the black team's decision-maker, the mafia kill doesn't happen
  const donPlayer = g.players.find(p=>p.roleId==='don');
  let decisionMakerNumber = null;
  if(donPlayer && donPlayer.alive){
    decisionMakerNumber = donPlayer.number;
  } else {
    const aliveMafiaOnly = g.players.filter(p=>p.roleId==='mafia' && p.alive);
    if(aliveMafiaOnly.length===1) decisionMakerNumber = aliveMafiaOnly[0].number;
  }
  if(decisionMakerNumber!=null && blocked.includes(decisionMakerNumber)){
    res.mafiaVictim = null;
  }

  const deaths = new Set();
  if(res.mafiaVictim && res.mafiaVictim !== res.savedNumber) deaths.add(res.mafiaVictim);
  if(res.maniacVictim && res.maniacVictim !== res.savedNumber) deaths.add(res.maniacVictim);
  if(res.zlodiyKillVictim && res.zlodiyKillVictim !== res.savedNumber) deaths.add(res.zlodiyKillVictim);
  deaths.forEach(n=>{
    const p = g.players.find(pl=>pl.number===n);
    if(p) p.alive = false;
  });
  g.nightSummary = { deaths:[...deaths], checks: res.checks };
  g.log.push({round:g.round, type:'night', summary:g.nightSummary});
  g.screen = 'night-summary';
  saveGame();
  render();
}

/* night summary is folded into renderNight via special screen */
function renderNightSummary(root, nav){
  const g = state.game;
  const sum = g.nightSummary;
  root.appendChild(el(`<div class="tag" style="margin-bottom:8px; display:inline-block;">Після ночі ${g.round}</div>`));
  renderInlineNotes(root);

  if(sum.phase===undefined){
    sum.phase = sum.deaths.length ? 'death-announce' : 'done';
    sum.deathIdx = 0;
  }

  const navWrap = el(`<div class="app-nav"></div>`);
  const backBtn = el(`<button class="ghost">Назад</button>`);
  backBtn.disabled = undoStack.length===0;
  backBtn.addEventListener('click', universalGoBack);

  if(sum.phase==='death-announce'){
    const num = sum.deaths[sum.deathIdx];
    const prefix = sum.deathIdx===0 ? 'Місто прокидається, але, на жаль, без гравця під номером' : 'Також, на жаль, без гравця під номером';
    root.appendChild(el(`<div class="card"><div class="theme-text">${prefix} ${num}.</div></div>`));
    const next = el(`<button class="primary">Далі — останнє слово</button>`);
    next.addEventListener('click', ()=>{ pushUndo(); sum.phase='death-lastword'; saveGame(); render(); });
    navWrap.appendChild(backBtn); navWrap.appendChild(next);
    nav.appendChild(navWrap);
    return;
  }

  if(sum.phase==='death-lastword'){
    const num = sum.deaths[sum.deathIdx];
    root.appendChild(el(`<div class="night-banner">Останнє слово гравця №${num}.</div>`));
    const card = el(`<div class="card"></div>`);
    renderTimerBlock(card, state.settings.timers.lastWord, ()=>{}, `№${num} · ${state.settings.timers.lastWord} сек`);
    root.appendChild(card);
    const isLastDeath = sum.deathIdx >= sum.deaths.length-1;
    const next = el(`<button class="primary">${isLastDeath ? 'Далі' : 'Наступний загиблий'}</button>`);
    next.addEventListener('click', ()=>{
      stopTimer();
      pushUndo();
      if(!isLastDeath){ sum.deathIdx++; sum.phase='death-announce'; }
      else { sum.phase='done'; }
      saveGame(); render();
    });
    navWrap.appendChild(backBtn); navWrap.appendChild(next);
    nav.appendChild(navWrap);
    return;
  }

  // phase 'done'
  if(sum.deaths.length===0){
    root.appendChild(el(`<div class="card"><div class="theme-text">Місто прокидається. Цієї ночі ніхто не загинув.</div></div>`));
  }
  const winner = computeWinner();
  if(winner==='red'){ root.appendChild(el(`<div class="night-banner">${(g.theme&&g.theme.peacefulWin)||'Мафії більше немає. Мирні перемагають!'}</div>`)); }
  else if(winner==='black'){ root.appendChild(el(`<div class="night-banner">${(g.theme&&g.theme.mafiaWin)||'Мафію вже не переголосувати. Мафія перемагає!'}</div>`)); }
  else if(winner==='maniac'){ root.appendChild(el(`<div class="night-banner">Лишились тільки Маніяк і по одному з кожної команди. Маніяк переміг сам!</div>`)); }
  else if(sum.deaths.length>0){
    root.appendChild(el(`<div class="card"><div class="muted">Ніч закінчилась. Можна переходити до денного обговорення.</div></div>`));
  }

  navWrap.appendChild(backBtn);
  if(winner){
    const endBtn = el(`<button class="primary">Завершити гру</button>`);
    endBtn.addEventListener('click', ()=>{ pushUndo(); state.screen='end'; g.screen='end'; saveGame(); render(); });
    navWrap.appendChild(endBtn);
  } else {
    const dayBtn = el(`<button class="primary">Перейти до дня</button>`);
    dayBtn.addEventListener('click', ()=>{ pushUndo(); beginDay(); });
    navWrap.appendChild(dayBtn);
  }
  nav.appendChild(navWrap);
}
