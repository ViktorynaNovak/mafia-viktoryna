<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ведучий Мафії</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#12151a;
    --panel:#1b1f26;
    --panel-2:#232830;
    --line:#2d333d;
    --text:#eee9df;
    --muted:#8b8f98;
    --lamp:#c6e833;
    --lamp-dim:#4a5a12;
    --danger:#b23a48;
    --danger-dim:#4a2026;
    --ok:#5a8a6b;
    --radius:10px;
    --shadow-safe:env(safe-area-inset-top,0px);
    --shadow-safe-b:env(safe-area-inset-bottom,0px);
  }
  @media (prefers-color-scheme: light){
    :root:not([data-theme="dark"]){
      --bg:#12151a; --panel:#1b1f26; --panel-2:#232830; --line:#2d333d; --text:#eee9df; --muted:#8b8f98;
    }
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'IBM Plex Sans', system-ui, sans-serif;
    padding-top:var(--shadow-safe);
    padding-bottom:var(--shadow-safe-b);
    -webkit-tap-highlight-color:transparent;
  }
  html{scroll-padding-top:var(--shadow-safe);}
  h1,h2,h3{font-family:'Fraunces', serif; font-weight:600; margin:0 0 4px;}
  .app{max-width:640px; margin:0 auto; padding:20px 16px 80px;}
  header.top{
    position:sticky; top:0; z-index:5;
    background:linear-gradient(180deg, var(--bg) 70%, transparent);
    padding:calc(14px + var(--shadow-safe)) 16px 10px;
    margin:0 -16px 10px;
    display:flex; align-items:center; justify-content:space-between;
  }
  header.top .brand{font-family:'Fraunces',serif; font-weight:700; font-size:19px; letter-spacing:.2px;}
  header.top .phase{font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--muted);}
  .card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:16px;
    margin-bottom:14px;
  }
  .card + .card{margin-top:0;}
  .muted{color:var(--muted); font-size:14px; line-height:1.5;}
  .row{display:flex; gap:8px; align-items:center;}
  .row.wrap{flex-wrap:wrap;}
  .between{justify-content:space-between;}
  label.field-label{display:block; font-size:13px; color:var(--muted); margin-bottom:6px;}
  input[type=number], input[type=text], select{
    background:var(--panel-2); color:var(--text); border:1px solid var(--line);
    border-radius:8px; padding:9px 10px; font-size:15px; font-family:inherit; width:100%;
  }
  input[type=number]{width:72px; text-align:center; font-family:'IBM Plex Mono',monospace;}
  button{
    font-family:inherit; cursor:pointer; border:none; border-radius:8px;
    background:var(--panel-2); color:var(--text); padding:10px 14px; font-size:14px;
    border:1px solid var(--line);
  }
  button:active{transform:translateY(1px);}
  button.primary{background:var(--lamp); color:#1a2204; border-color:var(--lamp); font-weight:600;}
  button.danger{background:var(--danger); border-color:var(--danger); color:#fff;}
  button.ghost{background:transparent;}
  button.small{padding:6px 10px; font-size:13px;}
  button.timer-btn-active{background:var(--lamp) !important; border-color:var(--lamp) !important; color:#1a2204 !important;}
  button:disabled{opacity:.4; cursor:not-allowed;}
  .segmented{display:flex; gap:6px; flex-wrap:wrap;}
  .segmented button{flex:0 0 auto;}
  .segmented button.active{background:var(--lamp); color:#1a2204; border-color:var(--lamp); font-weight:600;}
  .role-row{
    display:grid; grid-template-columns:1fr 74px 90px auto; gap:8px; align-items:center;
    padding:8px 0; border-bottom:1px solid var(--line);
  }
  .role-row:last-child{border-bottom:none;}
  .role-name{font-size:15px;}
  .team-dot{display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:7px;}
  .team-dot.black{background:#3a3f47; border:1px solid #555;}
  .team-dot.red{background:var(--danger);}
  .team-dot.neutral{background:#8a7a3a;}
  .total-bar{
    display:flex; align-items:center; justify-content:space-between;
    font-family:'IBM Plex Mono',monospace; font-size:14px; margin-top:10px; padding-top:10px;
    border-top:1px dashed var(--line);
  }
  .total-bar.ok{color:var(--ok);}
  .total-bar.bad{color:var(--danger);}
  .order-row{
    display:flex; align-items:center; gap:10px; padding:9px 6px; border-bottom:1px solid var(--line);
    position:relative;
  }
  .order-row:last-child{border-bottom:none;}
  .order-idx{font-family:'IBM Plex Mono',monospace; color:var(--muted); width:18px;}
  .order-name{flex:1;}
  .order-btns{display:flex; gap:4px;}
  .player-grid{
    display:grid; grid-template-columns:repeat(5, 1fr); gap:8px; margin:10px 0;
  }
  .player-btn{
    aspect-ratio:1; border-radius:8px; background:var(--panel-2); border:1px solid var(--line);
    font-family:'IBM Plex Mono',monospace; font-size:16px; font-weight:600; color:var(--text);
    display:flex; align-items:center; justify-content:center; position:relative;
  }
  .player-btn.selected{border:3px dashed #ffffff !important; color:#fff;}
  .player-btn.selected2{border:3px dashed #ffffff !important; color:#fff;}
  .player-btn.selected2::after{
    content:'2'; position:absolute; bottom:1px; right:4px; font-size:10px; font-weight:700; color:#fff;
  }
  .player-btn.dead{opacity:.25; text-decoration:line-through;}
  .player-btn.blocked::after{
    content:'⦸'; position:absolute; top:2px; right:4px; font-size:11px; color:var(--danger);
  }
  .player-btn.forbidden{
    border:3px dashed var(--danger) !important; opacity:1;
  }
  .player-btn.forbidden::after{
    content:'*'; position:absolute; top:0px; right:5px; font-size:16px; font-weight:700; color:var(--danger);
  }
  .player-btn.immune{
    border:2px solid var(--lamp) !important; opacity:1;
  }
  .player-btn.immune::after{
    content:'🛡'; position:absolute; top:-2px; right:2px; font-size:12px;
  }
  .player-btn.speaker-now{
    border:3px dashed #ffffff !important; color:#fff;
  }
  .player-btn.speaker-now:disabled{ opacity:1; }
  .player-btn.already-nominated{
    background:#26405f !important; border-color:#3a5f8a !important; color:#dcecff;
  }
  .player-btn.already-nominated:disabled{ opacity:1; }
  .timer-display{
    font-family:'IBM Plex Mono',monospace; font-size:56px; text-align:center; font-weight:600;
    letter-spacing:1px; margin:4px 0 10px; color:var(--lamp);
  }
  .timer-display.warn{color:var(--danger);}
  .night-banner{
    background:var(--panel-2); border:1px solid var(--line); border-radius:8px;
    padding:12px 14px; font-size:15px; line-height:1.5; margin-bottom:12px;
  }
  .night-banner b{color:var(--lamp);}
  .step-progress{display:flex; gap:4px; margin-bottom:12px;}
  .step-progress span{flex:1; height:3px; background:var(--line); border-radius:2px;}
  .step-progress span.done{background:var(--lamp);}
  .step-progress span.now{background:var(--danger);}
  .theme-text{font-size:18px; line-height:1.5; font-family:'Fraunces',serif; margin:14px 0;}
  .stack{display:flex; flex-direction:column; gap:10px;}
  .hidden{display:none !important;}
  footer.nav{
    position:fixed; left:0; right:0; bottom:0; z-index:5;
    background:linear-gradient(0deg, var(--bg) 65%, transparent);
    padding:10px 16px calc(14px + var(--shadow-safe-b));
    display:flex; gap:8px; justify-content:center;
  }
  footer.nav .app-nav{max-width:640px; width:100%; display:flex; gap:8px;}
  footer.nav button{flex:1;}
  .tag{display:inline-block; font-size:11px; padding:2px 7px; border-radius:20px; border:1px solid var(--line); color:var(--muted); font-family:'IBM Plex Mono',monospace;}
  .kv{display:flex; justify-content:space-between; font-size:14px; padding:5px 0;}
  .divider{height:1px; background:var(--line); margin:12px 0;}
  .assign-list{display:flex; flex-direction:column; gap:6px; margin:10px 0;}
  .assign-list .kv{border-bottom:1px solid var(--line); padding-bottom:6px;}
  .empty-note{font-size:13px; color:var(--muted); text-align:center; padding:18px 0;}
  ::selection{background:var(--lamp); color:#1a2204;}
</style>
</head>
<body>
<div id="splashOverlay" style="position:fixed; inset:0; z-index:100;">
  <canvas id="splashCanvas" style="position:absolute; inset:0; width:100%; height:100%; z-index:1;"></canvas>
  <button id="splashClose" style="position:fixed; top:calc(16px + env(safe-area-inset-top,0px)); right:16px; width:36px; height:36px; border-radius:50%; background:var(--panel-2); border:1px solid var(--line); color:var(--text); font-size:17px; line-height:1; cursor:pointer; z-index:3;">✕</button>
</div>
<div class="app" id="app">
  <header class="top">
    <div>
      <div class="brand">Ведучий Мафії</div>
      <div style="font-size:11px; margin-top:-2px; color:var(--lamp); font-weight:600;">Гра Вікторини Новак</div>
    </div>
    <div class="row" style="gap:10px; align-items:center;">
      <div class="phase" id="phaseLabel">Налаштування</div>
      <button id="menuBtn" class="small ghost" style="padding:5px 9px;">☰</button>
    </div>
  </header>
  <div id="screens"></div>
</div>
<div id="menuPanel" class="hidden" style="position:fixed; top:calc(52px + env(safe-area-inset-top,0px)); right:16px; z-index:20; background:var(--panel); border:1px solid var(--line); border-radius:10px; box-shadow:0 8px 24px rgba(0,0,0,.4); overflow:hidden; min-width:220px;">
</div>
<footer class="nav" id="navBar"></footer>

<script>
/* ---------------- constants ---------------- */
const DEFAULT_ROLES = [
  {id:'don', name:'Дон мафії', team:'black', count:1, active:true, fixed:true, custom:false},
  {id:'mafia', name:'Мафія', team:'black', count:2, active:true, fixed:true, custom:false},
  {id:'zlodiy', name:'Злодій', team:'black', count:1, active:true, fixed:true, custom:false},
  {id:'sheriff', name:'Шериф', team:'red', count:1, active:true, fixed:true, custom:false},
  {id:'doctor', name:'Лікар', team:'red', count:1, active:true, fixed:true, custom:false},
  {id:'journalist', name:'Журналіст', team:'red', count:1, active:true, fixed:true, custom:false},
  {id:'maniac', name:'Маніяк', team:'red', count:1, active:true, fixed:true, custom:false, teamChoice:true},
  {id:'courtesan', name:'Повія', team:'red', count:0, active:true, fixed:true, custom:false, teamChoice:true, blocker:true},
  {id:'peaceful', name:'Мирний житель', team:'red', count:7, active:false, fixed:true, custom:false},
];
const DEFAULT_NIGHT_ORDER = ['mafia_kill','don_check','zlodiy_block','maniac','courtesan','doctor','sheriff','journalist'];
const STEP_LABEL = {
  mafia_kill:'Мафія і Дон — вбивство',
  don_check:'Дон — перевірка шерифа',
  zlodiy_block:'Злодій — блокування',
  maniac:'Маніяк — вбивство',
  courtesan:'Повія — блокування',
  doctor:'Лікар — рятунок',
  sheriff:'Шериф — перевірка',
  journalist:'Журналіст — перевірка',
};
const TIMER_PRESETS = [15,20,30,45,60];
const THEMES_SHORT = [
  {text:"Привіт усім! Сьогодні ми в звичайному українському селі — завтра ярмарок. Хтось пече пироги, хтось лається через паркан. От тільки кури зникають частіше, ніж мали б. Місто засинає.",
   mafiaWin:"Куряча загадка розкрита: мафія обчистила все село. Мафія перемагає!",
   peacefulWin:"Мафію спіймали за руку прямо біля курника. Мирні перемагають!"},
  {text:"Йо, народ! Гірськолижний курорт замело снігом на цілий тиждень, підйомники стоять. Нудьга — але хтось явно вирішив розважитись по-своєму. Місто засинає.",
   mafiaWin:"Курорт офіційно перейшов під контроль мафії. Гірка перемога — у мафії!",
   peacefulWin:"Мафію змили останнім підйомником з гори. Мирні перемагають!"},
  {text:"Добрий вечір! Вечірка на дачі мала закінчитись опівночі, а триває й досі. Сусіди вже двічі дзвонили дільничному. Місто засинає.",
   mafiaWin:"Дача офіційно відходить мафії разом із мангалом. Мафія перемагає!",
   peacefulWin:"Мафію винесли з дачі швидше за немиті шклянки. Мирні перемагають!"},
  {text:"Здоровенькі були! Цирк приїхав у маленьке містечко. Клоуни сьогодні якісь підозріло серйозні. Місто засинає.",
   mafiaWin:"Мафія забрала цирк собі — тепер тут усі клоуни її. Мафія перемагає!",
   peacefulWin:"Мафію викрили ще до головного номера. Мирні перемагають, оплески!"},
  {text:"Отже, шановні. Готель у горах відрізало снігом від усього світу. Світло дають на годину. Місто засинає.",
   mafiaWin:"Готель тепер повністю в руках мафії — заселяйтесь обережно. Мафія перемагає!",
   peacefulWin:"Мафію виселили ще до світанку. Мирні перемагають!"},
  {text:"Народ, увага! Знімають фільм жахів, і реквізит починає зникати по-справжньому. Режисер каже, що так і задумано. Місто засинає.",
   mafiaWin:"Фільм жахів вийшов надто реалістичним — мафія тут справжня. Мафія перемагає!",
   peacefulWin:"Знято! Мафію викрили ще до фінальних титрів. Мирні перемагають!"},
  {text:"Третій дзвінок! Літня школа в горах, вихователі сплять, учні — ні. У декого явно є секрети серйозніші за домашку. Місто засинає.",
   mafiaWin:"Мафія здала іспит на відмінно — і перемогла. Мафія перемагає!",
   peacefulWin:"Мафію лишили на другий рік. Мирні перемагають!"},
  {text:"Вітаю! Плавучий ринок на річці — торг до хрипоти. Один із торговців продає щось геть інше. Місто засинає.",
   mafiaWin:"Мафія скупила весь ринок. Мафія перемагає!",
   peacefulWin:"Мафію викрили просто на прилавку. Мирні перемагають!"},
  {text:"Отакої, зібралась вся родина! Великий сімейний з'їзд, борщ на столі, старі суперечки на столі теж. Щось тут явно не так. Місто засинає.",
   mafiaWin:"Родинна зустріч виявилась зустріччю мафії. Мафія перемагає!",
   peacefulWin:"Мафію викрили ще до десерту. Мирні перемагають!"},
  {text:"Слухайте сюди! Новорічний корпоратив бухгалтерії. Олів'є закінчився, хтось підмінив конверти з преміями. Місто засинає.",
   mafiaWin:"Премії, офіс і диско-куля — усе тепер мафії. Мафія перемагає!",
   peacefulWin:"Мафію звільнили без вихідної допомоги. Мирні перемагають!"},
  {text:"Гей, весільна компаніє! Весілля в сільському клубі, тамада охрип, наречена рахує конверти втретє. Місто засинає.",
   mafiaWin:"Весілля зіграли, а гроші забрала мафія. Мафія перемагає!",
   peacefulWin:"Мафію вигнали ще до танцю нареченої. Мирні перемагають!"},
  {text:"Гей, усі тут? Маршрутка стоїть у заторі сорок хвилин, водій вимкнув радіо з досади. Місто засинає.",
   mafiaWin:"Маршрутка приїхала прямо в кишеню мафії. Мафія перемагає!",
   peacefulWin:"Мафію висадили на наступній зупинці. Мирні перемагають!"},
  {text:"Вітаємо! Дачний сезон, банки для закруток закінчились, хтось ховає найкращі помідори. Місто засинає.",
   mafiaWin:"Урожай, банки й дача — усе відійшло мафії. Мафія перемагає!",
   peacefulWin:"Мафію закатали разом з огірками. Мирні перемагають!"},
  {text:"Пані та панове! Черга в поліклініці, талончиків знову не вистачило. Хтось стабільно проходить без черги. Місто засинає.",
   mafiaWin:"Виявилось, без черги проходила мафія. І перемогла. Мафія перемагає!",
   peacefulWin:"Мафію відправили в кінець черги назавжди. Мирні перемагають!"},
  {text:"Друзі! Дитячий табір, вожаті видихлись ще на третій день. Діти вигадали таємний код для нічних вилазок. Місто засинає.",
   mafiaWin:"Табір офіційно захопила мафія — зміну продовжено. Мафія перемагає!",
   peacefulWin:"Мафію відправили додому першим автобусом. Мирні перемагають!"},
  {text:"Салют! Сільська дискотека, з колонок хрипить стара пісня. Хтось прийшов сюди не тільки потанцювати. Місто засинає.",
   mafiaWin:"Дискотека закінчилась, а мафія танцює далі — вона перемогла. Мафія перемагає!",
   peacefulWin:"Діджей вимкнув музику мафії назавжди. Мирні перемагають!"},
  {text:"Привіт! Шкільний випускний, вальс станцювали, батьки знімають усе на телефон. Хтось приховує більше, ніж оцінки. Місто засинає.",
   mafiaWin:"Атестат зрілості отримала тільки мафія. Мафія перемагає!",
   peacefulWin:"Мафію відрахували ще до вручення дипломів. Мирні перемагають!"},

   mafiaWin:"Матч зіграно, кубок забрала мафія. Мафія перемагає!",
   peacefulWin:"Мафії показали червону картку назавжди. Мирні перемагають!"},
  {text:"Сусіди, доброго! Гаражний кооператив біля траси, чоловіки лагодять машину ще з обіду. Хтось приховує більше, ніж зламаний карбюратор. Місто засинає.",
   mafiaWin:"Усі гаражі тепер записані на мафію. Мафія перемагає!",
   peacefulWin:"Мафію знайшли просто під капотом. Мирні перемагають!"},
  {text:"Хто ще не спить? Нічна зміна на хлібозаводі, тісто місять, конвеєр гуде без зупинки. Одна буханка сьогодні вийшла геть дивної форми. Місто засинає.",
   mafiaWin:"Тісто підмісила мафія — і рецепт перемоги тепер її. Мафія перемагає!",
   peacefulWin:"Мафію знайшли просто в мішку з борошном. Мирні перемагають!"},
  {text:"Привіт, шукачі пригод! Похід по гриби, кошики майже повні, хтось відстав у лісі. Місто засинає.",
   mafiaWin:"У лісі загубились не гриби, а мирні. Мафія перемагає!",
   peacefulWin:"Мафію знайшли швидше за білі гриби. Мирні перемагають!"},
  {text:"Народ, до справи! Закриття зміни в супермаркеті, каса не сходиться вже вдруге за тиждень. Місто засинає.",
   mafiaWin:"Недостача в касі — це були витрати мафії. Мафія перемагає!",
   peacefulWin:"Мафію спіймали на камеру в торговому залі. Мирні перемагають!"},
  {text:"Доброго! Потяг Київ–Львів, провідниця розносить чай. Хтось у сусідньому купе говорить забагато зайвого по телефону. Місто засинає.",
   mafiaWin:"Потяг доїхав, а керує тепер мафія. Мафія перемагає!",
   peacefulWin:"Мафію висадили на найближчій станції. Мирні перемагають!"},
  {text:"Ну що, всі з відрами? Суботник у дворі, всі фарбують лавки. Хтось явно рахує зовсім не мітли. Місто засинає.",
   mafiaWin:"Двір прибрали, а керує ним тепер мафія. Мафія перемагає!",
   peacefulWin:"Мафію винесли разом зі сміттям. Мирні перемагають!"},
  {text:"Кіно скінчилось? Кінотеатр після останнього сеансу, прибиральниці збирають попкорн із підлоги. У темному залі хтось досі сидить. Місто засинає.",
   mafiaWin:"Титри давно закінчились, а мафія лишилась дивитись далі. Мафія перемагає!",
   peacefulWin:"Мафію знайшли ще на середині титрів. Мирні перемагають!"},
  {text:"З днем народження — точніше, вітаю на святі! День народження в затишному кафе, торт ще не різали. Один із гостей дарує підозріло дорогий подарунок. Місто засинає.",
   mafiaWin:"Подарунок був хабарем — і мафія перемогла. Мафія перемагає!",
   peacefulWin:"Мафію задмухали разом зі свічками. Мирні перемагають!"},
  {text:"Рибалки, привіт! Нічна риболовля на ставку, термос із чаєм майже порожній. Хтось надовго відходить «по дрова». Місто засинає.",
   mafiaWin:"На гачок цього разу впіймали не рибу. Мафія перемагає!",
   peacefulWin:"Мафію витягли з води швидше за карася. Мирні перемагають!"},
  {text:"Ой, здрастуйте! Ремонт у під'їзді затягнувся на місяць. Мешканці сперечаються в чаті, хто винен у протіканні даху. Місто засинає.",
   mafiaWin:"Дах протікав не просто так — це мафія качала гроші з ремонту. Мафія перемагає!",
   peacefulWin:"Мафію вигнали з чату будинку назавжди. Мирні перемагають!"},
  {text:"Мандрівники, привіт! Заправка на трасі, водії тягнуть каву з апарата. Хтось надовго завис у туалеті. Місто засинає.",
   mafiaWin:"Заправку тихо переписали на мафію. Мафія перемагає!",
   peacefulWin:"Мафію знайшли ще на під'їзді до каси. Мирні перемагають!"},
  {text:"Слава Богу, приїхали! Літній табір відпочинку в горах, вечір біля вогнища, гітара йде по колу. Хтось відмовляється співати свій куплет. Місто засинає.",
   mafiaWin:"Останній куплет заспівала мафія — і забрала мікрофон собі. Мафія перемагає!",
   peacefulWin:"Мафію не пустили навіть до вогнища. Мирні перемагають!"},
  {text:"Гов, є хто? Нічна зміна на молокозаводі, цистерни гудуть, оператор третю каву п'є. У звіті вночі не сходиться пів тонни. Місто засинає.",
   mafiaWin:"Молоко скисло, а мафія забрала завод собі. Мафія перемагає!",
   peacefulWin:"Мафію знайшли просто біля цистерни. Мирні перемагають!"},
  {text:"Заходьте, заходьте! Пошта завалена посилками напередодні свят, сортувальники валяться з ніг. Одна посилка чомусь важча за накладну. Місто засинає.",
   mafiaWin:"Посилку з мафією так ніхто й не розкрив. Мафія перемагає!",
   peacefulWin:"Мафію викрили ще на сортуванні. Мирні перемагають!"},
  {text:"Тихо, тихо, всі є? Аптека на нічному чергуванні, дзвінок у двері о третій ночі. Фармацевт питає посвідчення вже вдруге. Місто засинає.",
   mafiaWin:"Рецепт на перемогу виписала собі мафія. Мафія перемагає!",
   peacefulWin:"Мафію не пустили далі за вітрину. Мирні перемагають!"},
  {text:"Прошу уваги! Заводський цех, нічна зміна, верстати гудуть без зупинки. Комірник каже, що деталей бракує вже не вперше. Місто засинає.",
   mafiaWin:"Цех тепер працює на мафію. Мафія перемагає!",
   peacefulWin:"Мафію знайшли просто біля верстата. Мирні перемагають!"},
  {text:"Алло, це кол-центр? Служба підтримки працює цілу ніч, у навушниках гудуть скарги клієнтів. Один оператор чомусь відповідає пошепки. Місто засинає.",
   mafiaWin:"Дзвінок скинула мафія — просто разом з усім офісом. Мафія перемагає!",
   peacefulWin:"Мафію передали в чергу технічної підтримки назавжди. Мирні перемагають!"},
  {text:"Диспетчерська на зв'язку! Таксопарк вночі, рації тріщать, водії скаржаться на дивного пасажира. Один виклик так і лишився без відповіді. Місто засинає.",
   mafiaWin:"Останнє замовлення забрала собі мафія. Мафія перемагає!",
   peacefulWin:"Мафію висадили ще на першому світлофорі. Мирні перемагають!"},
  {text:"Ти диви, ще працюємо! Друкарня зверстує вранішню газету, фарба ще не висохла. У завтрашньому номері одна стаття виглядає геть інакше, ніж її здавали. Місто засинає.",
   mafiaWin:"Заголовок на першій шпальті написала мафія. Мафія перемагає!",
   peacefulWin:"Мафію зняли з друку ще в останню секунду. Мирні перемагають!"},
  {text:"Гей, лікарю! Ветеринарна клініка на нічному чергуванні, у приймальні нявкає й гавкає хор. Один із відвідувачів привів геть незрозумілу тварину. Місто засинає.",
   mafiaWin:"Ветлікарню тихо взяла під контроль мафія. Мафія перемагає!",
   peacefulWin:"Мафію розпізнали з першого погляду. Мирні перемагають!"},
  {text:"Заходьте, сідайте! Перукарня працює допізна перед весільним сезоном, ножиці не спиняються. Одна клієнтка вже годину описує зачіску, якої не буває. Місто засинає.",
   mafiaWin:"Стрижку зробили — тепер усі схожі на мафію. Мафія перемагає!",
   peacefulWin:"Мафію підстригли раніше, ніж вона встигла втекти. Мирні перемагають!"},
  {text:"Ти ба, ще є клієнт! Тату-салон працює допізна, машинка дзижчить. Пізній відвідувач просить набити щось, чого майстер ще не бачив. Місто засинає.",
   mafiaWin:"Тепер у всієї мафії однакове тату. Мафія перемагає!",
   peacefulWin:"Мафію викрили ще на етапі ескізу. Мирні перемагають!"},
  {text:"Овва, а тут ще світиться! Відділення банку вже зачинили, але охорона й бухгалтерія затримались. У сейфі щось не сходиться вже вдруге. Місто засинає.",
   mafiaWin:"Сейф відкрила мафія — і кодом стала її перемога. Мафія перемагає!",
   peacefulWin:"Мафію взяли прямо біля банкомата. Мирні перемагають!"},
  {text:"Христос рождається! Свят-вечір, дванадцять страв на столі, уся родина зібралась уперше за рік. Хтось за столом чомусь не їсть кутю. Місто засинає.",
   mafiaWin:"Кутю доїла мафія — і забрала стіл собі. Мафія перемагає!",
   peacefulWin:"Мафію викрили ще до узвару. Мирні перемагають!"},
  {text:"У-у-у, страшно! Гелловінська вечірка в барі, костюми один моторошніший за інший. Одна маска чомусь зовсім не знімається. Місто засинає.",
   mafiaWin:"Найкращий костюм вечора був у мафії — вона й перемогла. Мафія перемагає!",
   peacefulWin:"Маску мафії зірвали ще опівночі. Мирні перемагають!"},
  {text:"Наступне питання! Квіз у пабі, команди сваряться через останній бал. Одна команда відповідає на все підозріло правильно. Місто засинає.",
   mafiaWin:"Останній бал і всю перемогу забрала мафія. Мафія перемагає!",
   peacefulWin:"Мафію дискваліфікували ще до фіналу. Мирні перемагають!"},
  {text:"Мікрофон ваш! Караоке-бар, черга на пісню розписана на дві години вперед. Хтось співає так, наче й не збирався колись зупинятись. Місто засинає.",
   mafiaWin:"Останню пісню заспівала мафія — і забрала мікрофон назавжди. Мафія перемагає!",
   peacefulWin:"Мафію зняли зі сцени під свист. Мирні перемагають!"},
  {text:"Кидай кубик! Клуб настільних ігор, партія розтягнулась на всю ніч. Хтось явно грає не за правилами. Місто засинає.",
   mafiaWin:"Партію та й весь клуб виграла мафія. Мафія перемагає!",
   peacefulWin:"Мафію вивели з гри одним ходом. Мирні перемагають!"},
  {text:"Гей, геймери! Кіберспортивний турнір, комп'ютери гудуть до ранку. Один гравець підозріло добре знає наступний хід супротивника. Місто засинає.",
   mafiaWin:"Турнір, кубок і сервер — усе тепер у мафії. Мафія перемагає!",
   peacefulWin:"Мафію відключили від мережі назавжди. Мирні перемагають!"},
  {text:"Ласкаво просимо на вернісаж! Відкриття виставки в галереї, вино в пластикових келихах, картини ще пахнуть фарбою. Одна робота підписана незрозуміло ким. Місто засинає.",
   mafiaWin:"Найдорожчу картину купила мафія. Мафія перемагає!",
   peacefulWin:"Мафію зняли з виставки ще до фуршету. Мирні перемагають!"},
  {text:"Наступна глава! Книжковий клуб зібрався обговорити фінал, суперечка триває вже годину. Хтось явно не дочитав до кінця. Місто засинає.",
   mafiaWin:"Найкращу рецензію написала мафія — і забрала книжковий клуб собі. Мафія перемагає!",
   peacefulWin:"Мафію викрили ще на першому розділі. Мирні перемагають!"},
  {text:"Мікрофон відкритий! Вечір поезії в маленькій кав'ярні, свічки, читання по колу. Один вірш звучить підозріло схожим на погрозу. Місто засинає.",
   mafiaWin:"Останню строфу дочитала мафія — і забрала оплески собі. Мафія перемагає!",
   peacefulWin:"Мафію освистали ще на другому рядку. Мирні перемагають!"},
  {text:"Ваш вихід! Стендап у маленькому клубі, зал регоче, окрім одного столика. За тим столиком регочуть якось зловісно. Місто засинає.",
   mafiaWin:"Найкращий жарт вечора розповіла мафія. Мафія перемагає!",
   peacefulWin:"Мафію освистали з першого ряду. Мирні перемагають!"},
  {text:"Диригент стукає паличкою! Репетиція церковного хору перед святом, голоси зливаються в один. Один голос чомусь фальшивить навмисно. Місто засинає.",
   mafiaWin:"Соло дісталось мафії — і хор тепер її. Мафія перемагає!",
   peacefulWin:"Мафію вивели з хору ще на розспівці. Мирні перемагають!"},
  {text:"Раз, і — рух! Репетиція танцювального колективу перед конкурсом, зал в дзеркалах. Один рух у комбінації геть не за хореографією. Місто засинає.",
   mafiaWin:"Останній номер станцювала мафія — і забрала кубок. Мафія перемагає!",
   peacefulWin:"Мафію зняли з номера ще на репетиції. Мирні перемагають!"},
  {text:"Шах і мат — чи ще ні? Шаховий турнір у бібліотеці, тиша аж дзвенить. Один гравець думає над ходом підозріло довго. Місто засинає.",
   mafiaWin:"Партію і турнір забрала собі мафія. Мафія перемагає!",
   peacefulWin:"Мафії поставили мат раніше, ніж вона встигла подумати. Мирні перемагають!"},
  {text:"Останній рейс! Автостанція вночі, рейс затримується вже на дві години. Пасажири тісняться на лавках і одне на одного поглядають. Місто засинає.",
   mafiaWin:"Останній автобус повела мафія. Мафія перемагає!",
   peacefulWin:"Мафію зняли з рейсу ще на посадці. Мирні перемагають!"},
  {text:"Причалюємо! Пором через Дніпро, останній рейс на сьогодні, хвилі гойдають палубу. Один пасажир весь час дивиться за борт. Місто засинає.",
   mafiaWin:"Пором тепер пливе туди, куди скаже мафія. Мафія перемагає!",
   peacefulWin:"Мафію висадили ще до причалу. Мирні перемагають!"},
  {text:"Оголошується затримка рейсу! Аеропорт вночі, табло показує самі затримки. Хтось у залі очікування вже третю годину не спить і не сидить на місці. Місто засинає.",
   mafiaWin:"Рейс затримали, а мафія полетіла своїм маршрутом. Мафія перемагає!",
   peacefulWin:"Мафію зняли з рейсу на паспортному контролі. Мирні перемагають!"},
  {text:"Кермуй обережно! Велопохід, стоянка на ніч серед поля, велосипеди вервечкою біля наметів. Один велосипед чомусь переставили ближче до лісу. Місто засинає.",
   mafiaWin:"Педалі крутить тепер тільки мафія. Мафія перемагає!",
   peacefulWin:"Мафію наздогнали на першому підйомі. Мирні перемагають!"},
  {text:"Голосуємо палицею вгору — підвезете? Автостопники зібрались біля траси, чекають попутку вже другу годину. Один із них підозріло добре знає всі об'їзні дороги. Місто засинає.",
   mafiaWin:"Попутку зловила мафія — і всіх підвезла не туди. Мафія перемагає!",
   peacefulWin:"Мафію висадили на узбіччі. Мирні перемагають!"},
  {text:"Намети напоготові! Кемпінг у лісі, багаття тільки розгорілось, комарі лютують. Хтось відходить у темряву й довго не повертається. Місто засинає.",
   mafiaWin:"Ліс, намети й багаття — тепер усе мафії. Мафія перемагає!",
   peacefulWin:"Мафію знайшли за найближчим деревом. Мирні перемагають!"},
  {text:"Весла на воду! Сплав на байдарках, річка спокійна, вечір на березі. Одна байдарка чомусь пристала до берега сама. Місто засинає.",
   mafiaWin:"Течія віднесла перемогу прямо до мафії. Мафія перемагає!",
   peacefulWin:"Мафію витягли з води раніше, ніж вона встигла втекти. Мирні перемагають!"},
  {text:"М'яч у грі! Турнір із пляжного волейболу, пісок ще гарячий після дня. Одна команда грає підозріло злагоджено для випадкових знайомих. Місто засинає.",
   mafiaWin:"Матч-пойнт і кубок забрала мафія. Мафія перемагає!",
   peacefulWin:"Мафію вивели з гри без жодного очка. Мирні перемагають!"},
  {text:"Наступний привал! Гірський похід, стоянка на плато, зорі над головою. Хтось у наметі досі не спить і щось шепоче. Місто засинає.",
   mafiaWin:"Вершину і весь маршрут узяла мафія. Мафія перемагає!",
   peacefulWin:"Мафію зняли зі стежки ще на підйомі. Мирні перемагають!"},
  {text:"Тиша в лісі! Станція лісників, чергування триває вже другу добу. Один з лісників чомусь весь час дивиться на годинник. Місто засинає.",
   mafiaWin:"Ліс тепер вартує тільки мафія. Мафія перемагає!",
   peacefulWin:"Мафію вивели з лісу під конвоєм лісників. Мирні перемагають!"},
  {text:"Рушниці на місце! Мисливський будиночок у лісі, надворі гроза, каміном тріщать дрова. Один із гостей приїхав без жодних трофеїв і без пояснень. Місто засинає.",
   mafiaWin:"Будиночок, ліс і трофеї — усе відійшло мафії. Мафія перемагає!",
   peacefulWin:"Мафію вистежили ще на порозі. Мирні перемагають!"},
  {text:"Лунка готова! Зимова риболовля на льоду, термос уже порожній, клювання так і не почалось. Хтось свердлить лунку геть не там, де всі. Місто засинає.",
   mafiaWin:"Улов і ополонку забрала собі мафія. Мафія перемагає!",
   peacefulWin:"Мафію витягли з ополонки раніше риби. Мирні перемагають!"},
  {text:"Бачу дим! Вишка пожежного спостереження, чергування вночі, бінокль переходить з рук у руки. Хтось бачить вогник там, де його бути не мало. Місто засинає.",

  {text:"Оплески, будь ласка! Аматорський театральний гурток репетирує прем'єру просто перед показом, куліси ще пахнуть свіжою фарбою. Режисер нервово перевіряє репліки, костюмер підшиває останній рукав. Раптом виявляється, що хтось переставив декорації геть не за планом, і ніхто не зізнається, чия це була ідея. До завіси лишається година. Місто засинає.",
   mafiaWin:"Головну роль і всю прем'єру забрала собі мафія. Мафія перемагає!",
   peacefulWin:"Мафію зняли з афіші ще до прем'єри. Мирні перемагають!"},
  {text:"Ласкаво просимо на обжинковий ярмарок! Регіональний фольклорний фестиваль зібрав усі навколишні села — вишиванки, короваї, ансамблі з бубнами. Журі щойно оголосило перерву перед головним конкурсом пісні, і в цей час хтось непомітно міняє місцями конверти з результатами. Гучномовець тріщить, а конферансьє поки що тягне час анекдотами. Місто засинає.",
   mafiaWin:"Гран-прі фестивалю забрала собі мафія — і оркестр тепер грає для неї. Мафія перемагає!",
   peacefulWin:"Мафію зняли зі сцени просто на приспіві. Мирні перемагають!"},
  {text:"Лицарі, до зброї — навчально! Історичний фестиваль-реконструкція розкинув табір біля старої фортеці, лицарі в саморобних обладунках готуються до вечірнього турніру. Багаття горить, майстер клинка перевіряє затуплені мечі, менестрелі налаштовують лютні. Одна кольчуга чомусь виявляється важчою за всі інші, і власник не поспішає це пояснювати. Місто засинає.",
   mafiaWin:"Турнір і весь табір узяла під прапор мафія. Мафія перемагає!",
   peacefulWin:"Мафію роззброїли ще до бугурту. Мирні перемагають!"},
  {text:"Занурюємось! Клуб аматорського дайвінгу готується до нічного занурення в кар'єрі, гідрокостюми розкладені рядком на березі. Інструктор востаннє перевіряє балони, хтось нервово жартує про підводних чудовиськ. Коли підраховують пари для занурення, з'ясовується, що один дайвер записався геть без напарника — і про це ніхто не питав. Місто засинає.",
   mafiaWin:"На дні кар'єру лишився тільки прапор мафії. Мафія перемагає!",
   peacefulWin:"Мафію витягли на поверхню першою декомпресійною зупинкою. Мирні перемагають!"},
  {text:"Усім чекати сигналу! Гірськорятувальна команда на чергуванні в базовому таборі, рація потріскує, за вікном насувається негода. Раптом надходить сигнал про заблукалу групу туристів, і команда мчить збирати спорядження. Коли всі вже вдягнені, з'ясовується, що хтось із рятувальників зник іще до виклику. Місто засинає.",
   mafiaWin:"Рятувальну станцію та всі маршрути прибрала до рук мафія. Мафія перемагає!",
   peacefulWin:"Мафію знайшли раніше, ніж заблуклих туристів. Мирні перемагають!"},
  {text:"Порядок денний — вибори голови! Сільська рада зібралась на нічне засідання напередодні виборів старости, чай у гранчаках вистигає, протокол веде секретарка з ручкою напоготові. Дебати триваю вже другу годину, а один із кандидатів раптом знімає свою кандидатуру без жодних пояснень. Хтось у залі підозріло задоволено посміхається. Місто засинає.",
   mafiaWin:"Голову ради і всю раду обрала собі мафія. Мафія перемагає!",
   peacefulWin:"Мафію не переобрали навіть у ревізійну комісію. Мирні перемагають!"},
  {text:"Урожай яблук ще теплий! Садова кооперація збирає нічну зміну під час пікового врожаю, ящики з яблуками ростуть штабелями при світлі прожекторів. Бригадир рахує ящики вголос, хтось тягає кошики повз усіх без черги. На середині зміни один ящик виявляється підозріло легшим за решту — і жодних пояснень. Місто засинає.",
   mafiaWin:"Сад, ящики й увесь урожай прибрала собі мафія. Мафія перемагає!",
   peacefulWin:"Мафію витрусили разом із падалицею. Мирні перемагають!"},
  {text:"Бджоли гудуть навіть уночі! Пасічницький кооператив якраз відкачує мед пізнього збору, димарі димлять, центрифуга крутиться безперервно. Мед капає в бідони рівною цівкою, доки хтось не перекриває кран посеред процесу. Пасічники перезираються — ніхто не давав такої команди. Місто засинає.",
   mafiaWin:"Пасіку, мед і всі вулики забрала собі мафія. Мафія перемагає!",
   peacefulWin:"Мафію обкурили димарем ще на порозі. Мирні перемагають!"},
  {text:"Радіоаматори, у прямий ефір! Нічний радіоаматорський конкурс на дальність зв'язку триває вже кілька годин, навушники стискають скроні, антена крутиться на даху. Позивні летять один за одним у ефір, хтось веде облік у товстому журналі. Раптом один із учасників виходить в ефір із позивним, якого ніхто не реєстрував. Місто засинає.",
   mafiaWin:"Ефір, антену й журнал перехопила собі мафія. Мафія перемагає!",
   peacefulWin:"Мафію запеленгували ще на першому позивному. Мирні перемагають!"},
  {text:"Голки й нитки напоготові! Майстерня традиційного вбрання шиє костюми до завтрашнього фестивалю, тканини розкладені по всій підлозі, швацькі машинки не змовкають. Кожен елемент вишивки має своє значення, і майстриня вимогливо перевіряє кожен стібок. Раптом виявляється, що один з костюмів пошитий геть за іншим візерунком, ніж замовляли. Місто засинає.",
   mafiaWin:"Майстерню, тканини й фестиваль забрала собі мафія. Мафія перемагає!",
   peacefulWin:"Мафію розпороли по шву ще до примірки. Мирні перемагають!"},
  {text:"Дзвони чекають реставрації! Дзвіницю старої церкви ремонтують ночами, щоб встигнути до свята, риштування скрипить, майстер вистукує молоточком тріщини в металі. Робота йде повільно, бо кожен дзвін треба перевірити на звук. Раптом один із дзвонів видає звук, якого там не мало бути. Місто засинає.",
   mafiaWin:"Дзвіницю та всі дзвони привласнила собі мафія. Мафія перемагає!",
   peacefulWin:"Мафію зняли з риштування до завершення реставрації. Мирні перемагають!"},
  {text:"Верф чекає на приплив! Невелика човнярська верф на березі річки ремонтує рибальські човни цілу ніч перед сезоном, стружка летить з-під рубанків, смола булькає в казані. Майстер обходить кожен човен і стукає по обшивці, перевіряючи щільність. В одному з човнів під банкою знаходять щось геть не рибальське. Місто засинає.",
   mafiaWin:"Верф і весь флот забрала собі мафія. Мафія перемагає!",
   peacefulWin:"Мафію законопатили в трюмі назавжди. Мирні перемагають!"},
  {text:"Нічний ринок відкрито! Вуличні ятки з їжею вишикувались вздовж набережної, пара над казанами підіймається аж до ліхтарів, музиканти грають на розі. Черга то тут, то там штовхається за найкращими стравами. Раптом один із продавців зникає з-за прилавка посеред найбільшого напливу покупців. Місто засинає.",
   mafiaWin:"Нічний ринок і всі ятки перейшли під мафію. Мафія перемагає!",
   peacefulWin:"Мафію виставили з ринку без здачі. Мирні перемагають!"},
  {text:"Ярмарок середньовіччя чекає на публіку! Історичний фестиваль розкинув намети біля старого замку, ковалі кують сувеніри просто на очах у глядачів, менестрелі виступають по черзі на дерев'яній сцені. Ярмарковий розпорядник оголошує головний конкурс костюмів, і в цей момент один з учасників зникає з натовпу. Місто засинає.",
   mafiaWin:"Ярмарок, замок і головний приз забрала собі мафія. Мафія перемагає!",
   peacefulWin:"Мафію зняли з п'єдесталу ще до нагородження. Мирні перемагають!"},
  {text:"Пробірки готові! Шкільна команда готується до обласного етапу наукового конкурсу просто вночі в лабораторії, реактиви булькають у колбах, керівник гуртка нервово гортає методичку. Дослід має спрацювати з першого разу, іншого шансу не буде. Раптом один з реактивів виявляється геть не тим, що записано на етикетці. Місто засинає.",
   mafiaWin:"Лабораторію та диплом переможця забрала собі мафія. Мафія перемагає!",
   peacefulWin:"Мафію розвели по пробірках ще до захисту роботи. Мирні перемагають!"},
  {text:"Шахова школа-інтернат готується до чемпіонату! Учні лишились на додаткове тренування, годинники клацають, дошки розставлені рядами. Тренер обходить парти й підказує дебюти пошепки. В одній із партій фігури розставлені геть не за класичним правилом. Місто засинає.",
   mafiaWin:"Турнір і весь інтернат виграла мафія. Мафія перемагає!",
   peacefulWin:"Мафії поставили мат раніше, ніж вона встигла розставити фігури. Мирні перемагають!"},
  {text:"Світло знову зникло! Гірський будиночок лишився без електрики через грозу, свічки розставлені по всіх кімнатах, генератор чомусь не заводиться з першого разу. Гості грають у карти при мерехтливому світлі, за вікном виє вітер. Хтось виходить перевірити генератор і довго не повертається. Місто засинає.",
   mafiaWin:"Будиночок, свічки й генератор дісталися мафії. Мафія перемагає!",
   peacefulWin:"Мафію знайшли просто біля генератора. Мирні перемагають!"},
  {text:"Дослід іде всю ніч! Університетська фізична лабораторія проводить довгий експеримент, який не можна переривати ні на хвилину, прилади гудуть, координатор веде журнал показників щогодини. Аспіранти по черзі чергують біля установки. На одному з чергувань показники приладу різко стрибають без жодної видимої причини. Місто засинає.",
   mafiaWin:"Лабораторію, дані й наукову ступінь забрала собі мафія. Мафія перемагає!",
   peacefulWin:"Мафію вирахували за похибкою у власних показниках. Мирні перемагають!"},
  {text:"Потяг на роз'їзді до ранку! Начальник маленької залізничної станції посеред степу чергує цілу ніч, лампа гойдається на вітрі, розклад руху лежить розгорнутий на столі. Раптом надходить телеграма про позаплановий состав, якого не мало бути в графіку. Начальник вдивляється в темряву колії. Місто засинає.",
   mafiaWin:"Станцію, стрілки й розклад перехопила мафія. Мафія перемагає!",
   peacefulWin:"Мафію відправили в депо назавжди. Мирні перемагають!"},
  {text:"Номер здають до ранку! Редакція маленької районної газети зверстовує завтрашній випуск в останню ніч перед друком, фарба ще не висохла, коректор перечитує шпальту вчетверте. Головний редактор раптом помічає, що одна стаття підписана автором, якого в редакції ніколи не було. Місто засинає.",
   mafiaWin:"Першу шпальту і всю редакцію забрала собі мафія. Мафія перемагає!",
   peacefulWin:"Мафію зняли з номера в останню секунду перед друком. Мирні перемагають!"},
  {text:"Тривога навчальна — чи ні? Добровільна пожежна дружина проводить нічні навчання в маленькому містечку, каски вишикувані рядком, шланги розкатані для тренування. Сигнал тривоги лунає раптово, і всі мчать по місцях. Коли рахують особовий склад біля машини, одного бійця бракує. Місто засинає.",
   mafiaWin:"Депо, машину й усю дружину прибрала до рук мафія. Мафія перемагає!",
   peacefulWin:"Мафію загасили раніше, ніж вона встигла розгорітись. Мирні перемагають!"},
  {text:"Завіса за годину, а костюми ще не готові! Аматорський театральний колектив готує прем'єру, гримерка завалена костюмами, суфлер шепоче текст за лаштунками. Режисер раптом виявляє, що головний реквізит — старовинний кинджал — таємничим чином зник зі столика бутафора. Місто засинає.",
   mafiaWin:"Прем'єру, кинджал і всю трупу забрала собі мафія. Мафія перемагає!",
   peacefulWin:"Мафію витягли з-за лаштунків під оплески залу. Мирні перемагають!"},
  {text:"Архів чекає на цифрування! Обласний архів проводить нічну зміну з оцифрування старих документів, сканери гудуть безперервно, архіваріус у білих рукавичках перегортає пожовклі сторінки. Раптом в одній із папок знаходять документ, якого за описом там бути не мало. Місто засинає.",
   mafiaWin:"Архів, сканери й усі документи прибрала до рук мафія. Мафія перемагає!",
   peacefulWin:"Мафію знайшли просто в тій самій папці. Мирні перемагають!"},
  {text:"Ласкаво просимо до музею одного експоната! Сільський краєзнавчий музей готується до візиту обласної комісії, куратор востаннє протирає вітрину з унікальною знахідкою — старовинною прикрасою, знайденою тут же в полі. Світло приглушене, сигналізація ще не підключена після ремонту. Коли комісія майже під дверима, куратор помічає, що вітрина порожня, а скло навіть не розбите. Місто засинає.",
   mafiaWin:"Музей і головний експонат прибрала до рук мафія. Мафія перемагає!",
   peacefulWin:"Мафію викрили за відбитком пальця на склі. Мирні перемагають!"},
  {text:"Мотор ще теплий! Автосервіс на околиці міста бере термінове нічне замовлення — клієнт присягається, що йому конче треба виїхати ще до світанку. Механік розбирає двигун при світлі переносної лампи, підмайстер подає інструменти. Раптом одна деталь із двигуна виявляється зовсім не тою маркою, що мала б стояти. Клієнт у сусідній кімнаті нервово поглядає на годинник. Місто засинає.",
   mafiaWin:"Автосервіс і всі запчастини забрала собі мафія. Мафія перемагає!",
   peacefulWin:"Мафію викрили по номеру запчастини. Мирні перемагають!"},
  {text:"Наклад іде в друк! Друкарня зверстала квитки на завтрашній концерт зірки, машина щойно почала друк накладу. Технолог рахує аркуші на виході, звіряючи з замовленням. Раптом виявляється, що надруковано рівно вдвічі більше квитків, ніж місць у залі. Директор друкарні терміново телефонує організаторам концерту. Місто засинає.",
   mafiaWin:"Наклад квитків і всю виручку забрала собі мафія. Мафія перемагає!",
   peacefulWin:"Мафію зняли з друку на півнакладу. Мирні перемагають!"},
  {text:"Спадщина чекає підпису! Нотаріальна контора працює допізна, бо спадкоємці з'їхались із різних міст лише на один вечір. Нотаріус розкладає документи по порядку, свідки нудьгують у коридорі. Коли доходить до головного пункту заповіту, з'ясовується, що сторінка з підписом заповідача виглядає підозріло свіжою порівняно з рештою тексту. Місто засинає.",
   mafiaWin:"Спадщину та контору прибрала до рук мафія. Мафія перемагає!",
   peacefulWin:"Мафію викрили по чорнилу на підписі. Мирні перемагають!"},
  {text:"Оцінка коштовностей о півночі! Ломбард приймає термінову партію коштовностей від постійного клієнта, оцінювач крутить у руках кожен виріб під лупою. Ваги показують цифри, які не сходяться з паспортом на виріб. Оцінювач мовчки відкладає одну прикрасу вбік і не поспішає озвучувати ціну. Місто засинає.",
   mafiaWin:"Ломбард і всі коштовності забрала собі мафія. Мафія перемагає!",
   peacefulWin:"Мафію зважили разом із фальшивим золотом. Мирні перемагають!"},
  {text:"Останній стібок перед подіумом! Швейна майстерня дошиває колекцію до завтрашнього показу мод, манекенниці приміряють сукні по черзі, дизайнерка нервово поправляє кожну складку. Раптом одна сукня виявляється пошитою за геть іншими мірками, ніж знімали в моделі. Дизайнерка вимагає негайно з'ясувати, хто переплутав викрійку. Місто засинає.",
   mafiaWin:"Колекцію і сам показ мод забрала собі мафія. Мафія перемагає!",
   peacefulWin:"Мафію розпороли по шву ще до виходу на подіум. Мирні перемагають!"},
  {text:"Механізм майже зібрано! Годинникова майстерня реставрує старовинний вежовий годинник, який мав вибити північ рівно через годину вперше за десять років. Майстер розкладає крихітні деталі на оксамитовій тканині, лупа приліплена до ока. Раптом однієї шестерні бракує, хоча щойно вона точно лежала на столі. Годинник тим часом продовжує цокати з розібраним циферблатом. Місто засинає.",
   mafiaWin:"Годинник, майстерню і сам час забрала собі мафія. Мафія перемагає!",
   peacefulWin:"Мафію розібрали на шестерні й здали годинникарю. Мирні перемагають!"},
  {text:"Молодняк готовий до виставки! Розплідник декоративних собак готує цуценят до завтрашньої обласної виставки, кожне має свій номерок і родовід. Заводчиця востаннє розчісує шерсть переможцю минулого сезону. Раптом виявляється, що бирка на одному з цуценят переплутана з геть іншим, значно ціннішим родоводом. Місто засинає.",
   mafiaWin:"Розплідник і всі родоводи прибрала до рук мафія. Мафія перемагає!",
   peacefulWin:"Мафію рознюхали ще до реєстрації на ринг. Мирні перемагають!"},
  {text:"Останній заїзд перед стартом! Кінний іподром готує фаворита до завтрашнього великого призу, конюх обходить денник із ліхтарем, тренер востаннє звіряє графік тренувань. Раптом виявляється, що кінь у деннику виглядає геть інакше, ніж на вчорашньому фото — начебто підмінили масть щіткою. Тренер придивляється уважніше. Місто засинає.",
   mafiaWin:"Іподром, фаворита і весь приз забрала собі мафія. Мафія перемагає!",
   peacefulWin:"Мафію зняли зі старту за підміну коня. Мирні перемагають!"},
  {text:"Ставок готовий приймати мальків! Рибне господарство проводить нічне зариблення ставка перед сезоном, мальків перевозять у спеціальних цистернах з киснем. Бригадир рахує кожну партію по накладній. Раптом одна цистерна виявляється значно легшою, ніж записано у документах на поставку. Місто засинає.",
   mafiaWin:"Ставок, мальків і все господарство забрала собі мафія. Мафія перемагає!",
   peacefulWin:"Мафію виловили сіткою разом із рештою малька. Мирні перемагають!"},
  {text:"Пелюстки розкриваються тільки вночі! Оранжерея ботанічного саду вирощує рідкісну орхідею, яка має розквітнути рівно до завтрашньої виставки квітів уперше за сім років. Садівниця перевіряє вологість повітря щогодини, підсвітка налаштована з точністю до градуса. Раптом горщик з орхідеєю виявляється переставленим на інше місце, де світла явно замало. Місто засинає.",
   mafiaWin:"Оранжерею, орхідею й усю виставку забрала собі мафія. Мафія перемагає!",
   peacefulWin:"Мафію пересадили в інший горщик і здали садівниці. Мирні перемагають!"},
  {text:"Партія вишиванок їде за кордон! Швейна фабрика дошиває експортне замовлення вишитих сорочок цілу ніч, вишивальні машини клацають безперервно. Менеджерка з якості перевіряє кожен виріб на відповідність зразку. Раптом один з візерунків виявляється вишитим дзеркально до затвердженого ескізу. Місто засинає.",
   mafiaWin:"Фабрику, замовлення і весь експорт забрала собі мафія. Мафія перемагає!",
   peacefulWin:"Мафію розпороли по шву ще до відправки на митницю. Мирні перемагають!"},
  {text:"Ілюстрації мали бути тут! Видавничий дім готує до друку дитячу книгу відомої авторки, макет майже готовий, редакторка востаннє звіряє текст із малюнками. Раптом виявляється, що половина ілюстрацій у папці зникла, а на їхньому місці — геть інші, підозріло схожі, але не ті. Місто засинає.",
   mafiaWin:"Книгу, ілюстрації і все видавництво забрала собі мафія. Мафія перемагає!",
   peacefulWin:"Мафію домалювали й здали редакторці. Мирні перемагають!"},
  {text:"Крем ще не застиг! Кондитерська цілу ніч випікає весільний торт на шість ярусів для завтрашнього великого весілля, кожен ярус має свій смак і візерунок з мастики. Кондитерка востаннє звіряє список смаків із замовленням нареченої. Раптом один із ярусів виявляється геть іншого смаку, ніж замовляли. Місто засинає.",
   mafiaWin:"Торт, весілля і всю кондитерську забрала собі мафія. Мафія перемагає!",
   peacefulWin:"Мафію з'їли разом із крайнім шматком торта. Мирні перемагають!"},
  {text:"Партія готова до ярмарку! М'ясокомбінат перевіряє нічну партію ковбаси перед завтрашнім обласним ярмарком виробників, технолог знімає проби з кожної варки. Раптом одна партія виявляється зробленою геть за іншим рецептом, ніж заявлено на етикетці. Технолог відкладає її окремо для повторної перевірки. Місто засинає.",
   mafiaWin:"М'ясокомбінат, ярмарку і весь рецепт забрала собі мафія. Мафія перемагає!",
   peacefulWin:"Мафію перекрутили разом з рештою фаршу. Мирні перемагають!"},
  {text:"Шапки чекають на зимовий сезон! Хутряна майстерня дошиває партію шапок до відкриття зимового сезону на ринку, кожна шкурка підібрана під пару. Майстриня перевіряє якість підкладки на кожному виробі. Раптом одна з шапок виявляється пошитою з геть іншого хутра, ніж усі замовлені. Місто засинає.",
   mafiaWin:"Майстерню, партію шапок і весь сезон забрала собі мафія. Мафія перемагає!",
   peacefulWin:"Мафію обстригли й здали просто на прилавку. Мирні перемагають!"},
  {text:"Черевики чекають на прем'єру! Взуттєва майстерня терміново ремонтує театральне взуття перед завтрашньою прем'єрою балету, майстер підбиває підошви при світлі настільної лампи. Реквізиторка приносить останню пару, яка виглядає геть новою — хоча мала бути тією самою поношеною парою головної партії. Місто засинає.",
   mafiaWin:"Майстерню, взуття й усю прем'єру забрала собі мафія. Мафія перемагає!",
   peacefulWin:"Мафію підбили й здали просто на репетиції. Мирні перемагають!"},
  {text:"Марка століття на кону! Клуб філателістів зібрався на закриту нічну зустріч заради оцінки рідкісної марки, яку один з колекціонерів привіз показати вперше. Лупа переходить з рук в руки, всі схвильовано перешіптуються про її можливу вартість. Раптом виявляється, що марка в альбомі — це якісна копія, а не оригінал. Місто засинає.",
   mafiaWin:"Марку, альбом і весь клуб забрала собі мафія. Мафія перемагає!",
   peacefulWin:"Мафію підколекціонували й здали під лупу. Мирні перемагають!"},
  {text:"Монета старша за все місто! Клуб нумізматів отримав на оцінку монету, знайдену місцевим фермером просто в полі під час оранки. Експерт клубу довго крутить її в руках, звіряючи з каталогом. Раптом виявляється, що монета підозріло важча за оригінал такого номіналу. Місто засинає.",
   mafiaWin:"Монету, каталог і весь клуб забрала собі мафія. Мафія перемагає!",
   peacefulWin:"Мафію зважили на моністу і здали фермеру. Мирні перемагають!"},
  {text:"Видання шукали двадцять років! Антикварна книгарня отримала запит на рідкісне видання, яке колекціонер розшукує вже два десятиліття. Продавець перебирає полиці при світлі гасової лампи для атмосфери. Раптом на полиці знаходиться книга з потрібною назвою, але геть іншого року видання, ніж треба. Місто засинає.",
   mafiaWin:"Книгарню, рідкісне видання і всіх колекціонерів забрала собі мафія. Мафія перемагає!",
   peacefulWin:"Мафію зачитали до дірки і здали продавцю. Мирні перемагають!"},
  {text:"Шафа чекає нового життя! Реставраційна майстерня меблів відновлює старовинну шафу для музею просто вночі, бо вранці її мають забрати на виставку. Майстер знімає стару фарбу шар за шаром, під нею виявляються дивні подряпини. Раптом у потайному відділенні шафи знаходять щось, чого там точно бути не мало. Місто засинає.",
   mafiaWin:"Шафу, музей і всю майстерню забрала собі мафія. Мафія перемагає!",
   peacefulWin:"Мафію відреставрували і здали в музей. Мирні перемагають!"},
  {text:"Сукня чекає на весілля мрії! Ательє весільних суконь дошиває головне замовлення сезону — сукню для доньки міського голови. Майстрині вишивають бісер вручну, кожна намистинка на обліку. Раптом на подолі сукні виявляється пляма, якої там точно не було годину тому. Місто засинає.",
   mafiaWin:"Сукню, ательє і все весілля забрала собі мафія. Мафія перемагає!",
   peacefulWin:"Мафію відіпрали разом із плямою. Мирні перемагають!"},
  {text:"Етикетки клеяться на кожну пляшку! Друкарня виготовляє партію етикеток для місцевої виноробні до завтрашньої відправки партії вина на виставку. Технолог звіряє кожен аркуш зі зразком. Раптом виявляється, що на половині етикеток вказано геть інший рік врожаю, ніж має бути. Місто засинає.",
   mafiaWin:"Друкарню, етикетки і всю партію вина забрала собі мафія. Мафія перемагає!",
   peacefulWin:"Мафію переклеїли і здали технологу. Мирні перемагають!"},
  {text:"Екран блимає востаннє! Телевізійне ательє приймає термінове замовлення на ремонт старого телевізора напередодні важливого футбольного матчу, майстер розбирає корпус і перевіряє лампи одну за одною. Раптом усередині корпусу, серед деталей, знаходиться щось, чого там точно бути не мало. Місто засинає.",
   mafiaWin:"Ательє, телевізор і весь матч забрала собі мафія. Мафія перемагає!",
   peacefulWin:"Мафію полагодили і здали разом із телевізором. Мирні перемагають!"},
  {text:"Глина ще тепла з печі! Гончарна майстерня випалює партію глечиків для завтрашнього ярмарку ремесел, піч гуде цілу ніч, майстер стежить за температурою через вічко. Раптом один із щойно випалених глечиків виявляється трохи важчим за решту, хоча форма й розмір ідентичні. Місто засинає.",
   mafiaWin:"Майстерню, піч і всю партію глечиків забрала собі мафія. Мафія перемагає!",
   peacefulWin:"Мафію обпалили і здали просто з печі. Мирні перемагають!"},
  {text:"Свічки горітимуть аж до ранку! Свічкова майстерня готує партію ароматичних свічок до завтрашнього ярмарку напередодні свята, віск застигає у формах рядами. Майстриня перевіряє кожну свічку на запах перед пакуванням. Раптом одна свічка пахне геть не так, як усі інші з тієї ж партії. Місто засинає.",
   mafiaWin:"Майстерню, свічки і весь ярмарок забрала собі мафія. Мафія перемагає!",
   peacefulWin:"Мафію розтопили разом із рештою воску. Мирні перемагають!"},
  {text:"Мед у сулії ферментується! Медоварня готує партію традиційної медовухи до фестивалю, глиняні сулії стоять рядами в льоху, майстер знімає пробу з кожної. Раптом одна сулія виявляється відкоркованою, хоча має бути запечатана ще на два тижні. Місто засинає.",
   mafiaWin:"Медоварню, сулії і весь фестиваль забрала собі мафія. Мафія перемагає!",
   peacefulWin:"Мафію заквасили разом з рештою меду. Мирні перемагають!"},
  {text:"Бджолині сім'ї готові до переселення! Бджолиний розплідник проводить нічне переселення молодих сімей у нові вулики, поки бджоли менш активні у прохолоді. Пасічник у сітці обережно переносить рамки одну за одною. Раптом одна з рамок виявляється геть порожньою, хоча вранці там точно кипіла робота. Місто засинає.",
   mafiaWin:"Розплідник, вулики й усіх бджіл забрала собі мафія. Мафія перемагає!",
   peacefulWin:"Мафію обкурили димарем і пересадили в інший вулик. Мирні перемагають!"},
  {text:"Грона важкі, мороз близько! Виноградник збирає останню нічну партію винограду просто перед першими заморозками, різники працюють при світлі налобних ліхтариків. Бригадир зважує кожен кошик і записує в журнал. Раптом один кошик виявляється набагато легшим, ніж має бути за розміром лози. Місто засинає.",
   mafiaWin:"Виноградник, урожай і все вино цього року забрала собі мафія. Мафія перемагає!",
   peacefulWin:"Мафію обібрали разом з виноградом. Мирні перемагають!"},
  {text:"Купаж вирішує все! Виноробня готує фінальний купаж вина перед обласним конкурсом, дегустатори по черзі куштують зразки з різних бочок. Головний виноробний майстер записує пропорції в закритий блокнот. Раптом виявляється, що одна з бочок промаркована геть не тим сортом винограду. Місто засинає.",
   mafiaWin:"Виноробню, купаж і весь конкурс забрала собі мафія. Мафія перемагає!",
   peacefulWin:"Мафію розлили по келихах і здали дегустаторам. Мирні перемагають!"},
  {text:"Головка сиру дозріває у льоху! Сироварня перевіряє партію витриманого сиру перед завтрашньою поставкою в ресторан, майстер простукує кожну головку кісточками пальців, як лікар. Раптом одна головка звучить геть інакше, ніж решта партії того самого віку. Місто засинає.",
   mafiaWin:"Сироварню, льох і всю партію сиру забрала собі мафія. Мафія перемагає!",
   peacefulWin:"Мафію нарізали скибками і здали в ресторан. Мирні перемагають!"},
  {text:"Останнє горнятко перед закриттям! Кав'ярня для гурманів влаштовує закриту нічну дегустацію рідкісного сорту кави, привезеного лише одною партією. Бариста готує кожну чашку за окремим рецептом. Раптом один із мішків із зернами виявляється підміненим на значно дешевший сорт. Місто засинає.",
   mafiaWin:"Кав'ярню, рідкісний сорт і всіх гурманів забрала собі мафія. Мафія перемагає!",
   peacefulWin:"Мафію змолотили разом з рештою зерен. Мирні перемагають!"},
  {text:"Лот номер один іде з молотка завтра! Антикварний магазин готує вітрину до завтрашнього великого аукціону, найціннішим лотом має стати старовинна скринька. Власник магазину востаннє протирає кожен експонат оксамитовою ганчіркою. Раптом скринька на вітрині виявляється точною копією, а не оригіналом. Місто засинає.",
   mafiaWin:"Магазин, скриньку і весь аукціон забрала собі мафія. Мафія перемагає!",
   peacefulWin:"Мафію оцінили в нуль і зняли з торгів. Мирні перемагають!"},
  {text:"Скло видувається просто на очах! Скловарна майстерня виконує термінове замовлення на партію ялинкових прикрас до новорічного ярмарку, майстер обертає розпечену краплю скла на трубці біля печі. Учень охолоджує готові вироби в спеціальній ванні з піском. Раптом одна з куль виявляється геть іншого кольору, ніж усі замовлені відтінки. Місто засинає.",
   mafiaWin:"Майстерню, піч і всю партію прикрас забрала собі мафія. Мафія перемагає!",
   peacefulWin:"Мафію видули і повісили на ялинку. Мирні перемагають!"},
  {text:"Аромат ще не запатентовано! Невелика парфумерна майстерня змішує новий аромат на замовлення місцевої зірки естради перед завтрашньою презентацією. Парфумер крапля за краплею додає ефірні олії, звіряючись із рецептурним записом у сейфі. Раптом флакон із готовою сумішшю пахне геть інакше, ніж мав би за формулою. Місто засинає.",
   mafiaWin:"Майстерню, рецепт і всю презентацію забрала собі мафія. Мафія перемагає!",
   peacefulWin:"Мафію розпилили з флакона і здали парфумеру. Мирні перемагають!"},
  {text:"Шкіра дубиться ще з діда-прадіда! Шкіряна майстерня обробляє партію шкур для замовлення сідел кінного клубу, майстер перевіряє кожен шматок на еластичність. Робота йде за старовинною технологією, яку тут бережуть у секреті. Раптом одна шкура виявляється обробленою геть іншим методом, ніж усі решта партії. Місто засинає.",
   mafiaWin:"Майстерню, шкіру і все замовлення забрала собі мафія. Мафія перемагає!",
   peacefulWin:"Мафію задубили разом з рештою шкур. Мирні перемагають!"},
  {text:"Килим тчеться вже третій тиждень! Килимарська майстерня доткує великий килим на замовлення для новоствореного музею народного побуту, верстат скрипить від щільної роботи. Майстриня звіряє кожен ряд з давнім орнаментом, знайденим в архіві. Раптом частина візерунка виявляється витканою геть іншими кольорами. Місто засинає.",
   mafiaWin:"Килимарню, орнамент і весь музей забрала собі мафія. Мафія перемагає!",
   peacefulWin:"Мафію виткали і здали просто на виставку. Мирні перемагають!"},
  {text:"Дзвін відлито — а звучить не так! Ливарня-дзвонарня відливає новий дзвін для сільської церкви замість старого, тріснулого воєнними роками, і сьогодні перша пробна дзвонитьба. Майстер-дзвонар слухає звук, приклавши вухо до бронзи. Раптом тон дзвону виявляється геть іншим, ніж розраховували за формулою сплаву. Місто засинає.",
   mafiaWin:"Ливарню, дзвін і всю церкву забрала собі мафія. Мафія перемагає!",
   peacefulWin:"Мафію відлили і повісили на дзвіницю. Мирні перемагають!"},
  {text:"Книга оживає під новою палітуркою! Палітурна майстерня реставрує стародавню книгу з бібліотеки колекціонера, зшиваючи розсипані сторінки вручну шовковою ниткою. Майстер обережно клеїть шкіряну палітурку, тиснену золотом за старим зразком. Раптом усередині книги, між сторінками, знаходять аркуш, якого там точно не мало бути за описом. Місто засинає.",
   mafiaWin:"Майстерню, книгу і всю бібліотеку забрала собі мафія. Мафія перемагає!",
   peacefulWin:"Мафію зшили в палітурку і здали колекціонеру. Мирні перемагають!"},
  {text:"Фарба з трав пахне літом! Майстерня натурального фарбування тканин готує партію пряжі для вишивальниць, використовуючи лише рослинні барвники за давніми рецептами. Майстриня перемішує чан з відваром цибулиння, здобуваючи потрібний відтінок. Раптом одна партія пряжі виходить геть іншого кольору, ніж мала б за тим самим рецептом. Місто засинає.",
   mafiaWin:"Майстерню, барвники і всю партію пряжі забрала собі мафія. Мафія перемагає!",
   peacefulWin:"Мафію пофарбували і розвісили сушитись. Мирні перемагають!"},
  {text:"Дзеркало відбиває більше, ніж треба! Стара майстерня зі сріблення дзеркал відновлює антикварне трюмо для театрального реквізиту, майстер завершує процес нанесення срібного шару в темній кімнаті, де світло може зіпсувати реакцію. Раптом на щойно посрібленій поверхні проступає візерунок, якого там точно не було на склі раніше. Місто засинає.",
   mafiaWin:"Майстерню, дзеркало і весь театральний реквізит забрала собі мафія. Мафія перемагає!",
   peacefulWin:"Мафію відбили в дзеркалі і здали театру. Мирні перемагають!"},
  {text:"Музична скринька грає одну мелодію на всіх! Годинникова майстерня реставрує старовинну музичну скриньку з валиком, знайдену на горищі старого маєтку, що перейшов місту. Майстер обережно чистить кожен зубчик валика голкою під лупою. Раптом скринька починає грати геть іншу мелодію, ніж записано в супровідному документі до неї. Місто засинає.",
   mafiaWin:"Майстерню, скриньку і всю мелодію забрала собі мафія. Мафія перемагає!",
   peacefulWin:"Мафію накрутили і здали під музику. Мирні перемагають!"},
  {text:"Змій злітає тільки при вітрі з степу! Майстерня повітряних зміїв готує велетенського паперового змія до завтрашнього фестивалю на пагорбі, конструкція з бамбукових реєк обклеюється рисовим папером. Майстер перевіряє кожен вузол мотузки на міцність. Раптом одна з реєк виявляється геть іншого дерева, ніж решта каркаса. Місто засинає.",
   mafiaWin:"Майстерню, змія і весь фестиваль забрала собі мафія. Мафія перемагає!",
   peacefulWin:"Мафію запустили і не змогли посадити назад. Мирні перемагають!"},
  {text:"Печатка застигає у сургучі! Майстерня сургучевих печаток виготовляє ексклюзивне тиснення для запрошень на прийом до обласної адміністрації, майстер крапає розтоплений сургуч і притискає металевий штамп. Помічниця розкладає готові конверти по порядку. Раптом на кількох печатках виявляється геть інший візерунок, ніж на затвердженому штампі. Місто засинає.",
   mafiaWin:"Майстерню, печатку і весь прийом забрала собі мафія. Мафія перемагає!",
   peacefulWin:"Мафію запечатали сургучем і здали на прийомі. Мирні перемагають!"},
  {text:"Мило пахне лавандою з власного городу! Невелика мильна майстерня варить партію натурального мила на замовлення спа-салону, господиня додає сушені трави зі свого городу за власним рецептом. Помічниця розливає гарячу масу по формах. Раптом один із брусків мила застигає геть іншого кольору, ніж усі інші з тієї самої варки. Місто засинає.",
   mafiaWin:"Майстерню, рецепт і все замовлення забрала собі мафія. Мафія перемагає!",
   peacefulWin:"Мафію намилили і змили водою. Мирні перемагають!"},
  {text:"Кахлі чекають на грубку в музеї! Гончарна майстерня виготовляє партію кахлів для реставрації старовинної грубки в краєзнавчому музеї, кожен кахель розписується вручну за старовинним зразком. Майстер обпалює перші зразки в печі, перевіряючи стійкість фарби. Раптом один з кахлів виходить із печі з геть іншим візерунком. Місто засинає.",
   mafiaWin:"Майстерню, кахлі і всю грубку забрала собі мафія. Мафія перемагає!",
   peacefulWin:"Мафію обпалили і вмурували в грубку. Мирні перемагають!"},
  {text:"Костюми чекають на новий сезон вистав! Костюмерня обласного театру перебирає весь гардероб перед новим сезоном, майстрині підшивають і латають костюми минулих вистав. Завідувачка костюмерні веде облік кожної речі за номером ролі. Раптом один з історичних костюмів виявляється підміненим на геть іншу епоху пошиву. Місто засинає.",
   mafiaWin:"Костюмерню, гардероб і весь сезон забрала собі мафія. Мафія перемагає!",
   peacefulWin:"Мафію переодягли і здали на костюмований бал. Мирні перемагають!"},
  {text:"Годинники цокають хором у вітрині! Антикварна крамниця годинників готує вітрину до ювілейної розпродажі, власник заводить кожен механізм, щоб усі цокали синхронно для ефекту. Раптом один з найдорожчих годинників зупиняється рівно на дванадцятій, хоча заведений щойно. Власник крамниці стукає по склу, не розуміючи причини. Місто засинає.",
   mafiaWin:"Крамницю, годинники і весь час забрала собі мафія. Мафія перемагає!",
   peacefulWin:"Мафію завели і поставили на розпродаж. Мирні перемагають!"},
  {text:"Срібло начищене до блиску перед бенкетом! Майстерня з полірування срібла готує парадний столовий набір для урочистого бенкету в старовинній садибі, кожна ложка й виделка натирається вручну спеціальною пастою. Дворецький перевіряє кожен предмет за описом сервізу. Раптом на одній з тарілок виявляється клеймо, якого немає в жодному з інших предметів набору. Місто засинає.",
   mafiaWin:"Садибу, сервіз і весь бенкет забрала собі мафія. Мафія перемагає!",
   peacefulWin:"Мафію начистили до блиску і здали дворецькому. Мирні перемагають!"},
  {text:"Рушник вишивається для весілля онуки! Гурток вишивальниць при сільському клубі дошиває весільний рушник за старовинним орнаментом бабусі нареченої, який передається в родині з покоління в покоління. Кожен хрестик рахують за давнім зразком, вишитим на пожовклому клаптику тканини. Раптом частина нового рушника виявляється вишитою дзеркально до оригінального орнаменту. Місто засинає.",
   mafiaWin:"Гурток, рушник і все весілля забрала собі мафія. Мафія перемагає!",
   peacefulWin:"Мафію вишили хрестиком і здали на весілля. Мирні перемагають!"},
  {text:"Пиво оцінює суворе журі! Обласний конкурс домашнього пивоваріння проводить нічну дегустацію наосліп, судді куштують зразки з пронумерованих кухлів, не знаючи, хто саме варив кожне пиво. Організатор веде протокол оцінок. Раптом один із зразків виявляється взагалі не тим сортом, що заявлений у списку учасників. Місто засинає.",
   mafiaWin:"Конкурс, кухлі і всі рецепти забрала собі мафія. Мафія перемагає!",
   peacefulWin:"Мафію продегустували і дискваліфікували. Мирні перемагають!"},
  {text:"Різьба оживає під стамескою! Різьбярська майстерня вирізає новий іконостас для відновленої сільської церкви, майстер працює над найскладнішим елементом — обличчям ангела. Стружка встеляє всю підлогу майстерні. Раптом на щойно вирізьбленому обличчі проступають риси, які майстер присягається, що не вирізьблював. Місто засинає.",
   mafiaWin:"Майстерню, іконостас і всю церкву забрала собі мафія. Мафія перемагає!",
   peacefulWin:"Мафію вистругали і поставили в іконостас. Мирні перемагають!"},
  {text:"Сідло чекає на переможця перегонів! Шкіряна майстерня кінного клубу дошиває парадне сідло для завтрашніх обласних перегонів, майстер пришиває останні прикраси зі срібними бляшками. Тренер клубу нетерпляче заглядає у двері кожні пів години. Раптом одна з бляшок на сідлі виявляється геть іншого металу, ніж решта комплекту. Місто засинає.",
   mafiaWin:"Майстерню, сідло і всі перегони забрала собі мафія. Мафія перемагає!",
   peacefulWin:"Мафію осідлали і зняли з перегонів. Мирні перемагають!"},
  {text:"Розпис оживає під пензлем майстрині! Майстерня петриківського розпису готує партію тарілок з традиційним орнаментом до обласної виставки народного мистецтва, майстриня виводить пензлем кожну квітку без попереднього ескізу — просто з пам'яті. Учениці спостерігають, намагаючись повторити рух руки. Раптом на одній з готових тарілок з'являється візерунок, якого немає в жодному з традиційних мотивів. Місто засинає.",
   mafiaWin:"Майстерню, розпис і всю виставку забрала собі мафія. Мафія перемагає!",
   peacefulWin:"Мафію розписали петриківкою і здали на виставку. Мирні перемагають!"},
  {text:"Брилі сохнуть на сонці й вночі теж! Майстерня плетіння солом'яних брилів готує партію капелюхів до літнього сезону, майстрині переплітають соломинки швидкими вправними рухами. Кожен бриль має свій розмір голови замовника, записаний у зошиті. Раптом один з готових брилів виявляється сплетеним геть іншим візерунком плетіння, ніж решта партії. Місто засинає.",
   mafiaWin:"Майстерню, брилі і весь літній сезон забрала собі мафія. Мафія перемагає!",
   peacefulWin:"Мафію розплели соломинка за соломинкою. Мирні перемагають!"},
  {text:"Сітка чекає на ранковий вихід у море! Рибальська артіль лагодить пошкоджені штормом сітки просто на березі при світлі багаття, кожен вузол зав'язується вручну за перевіреною технікою. Старший рибалка перевіряє кожну лагодку на міцність, тягнучи сітку щосили. Раптом в одній із сіток знаходять заплутаний предмет, якого там точно не мало бути. Місто засинає.",
   mafiaWin:"Артіль, сітки і весь ранковий вилов забрала собі мафія. Мафія перемагає!",
   peacefulWin:"Мафію заплутали в сітці і витягли на берег. Мирні перемагають!"},
  {text:"Ложка вирізана з єдиного шматка липи! Майстерня різьблення дерев'яного посуду готує партію ложок і мисок на замовлення етнографічного фестиваля, майстер стругає кожну ложку вручну, без жодного верстата. Учень шліфує готові вироби наждаком. Раптом одна з ложок виявляється вирізьбленою з геть іншого дерева, ніж решта партії. Місто засинає.",
   mafiaWin:"Майстерню, ложки і весь фестиваль забрала собі мафія. Мафія перемагає!",
   peacefulWin:"Мафію настругали трісками і здали на фестиваль. Мирні перемагають!"},
  {text:"Мідь блищить після лудіння! Майстерня лудіння мідного посуду відновлює старовинні казани сільського музею побуту перед виставкою, майстер наносить тонкий шар олова на внутрішню поверхню кожного казана над вогнем. Робота небезпечна і вимагає точності руху. Раптом один з казанів виявляється облудженим геть іншим металом, ніж належить за технологією. Місто засинає.",
   mafiaWin:"Майстерню, казани і всю виставку забрала собі мафія. Мафія перемагає!",
   peacefulWin:"Мафію розплавили разом з оловом. Мирні перемагають!"},
  {text:"Карета рипить готуючись до весілля! Майстерня з реставрації кінних карет готує старовинний екіпаж для весільної прогулянки заможних молодят, колесний майстер змащує кожну вісь і перевіряє ресори. Кучер приміряє парадну ліврею, готуючись до завтрашнього виїзду. Раптом герб на дверцятах карети виявляється геть іншим, ніж мав бути за замовленням родини нареченого. Місто засинає.",
   mafiaWin:"Майстерню, карету і все весілля забрала собі мафія. Мафія перемагає!",
   peacefulWin:"Мафію запрягли і розвернули з півдороги. Мирні перемагають!"},
  {text:"Кошик-вулик чекає на новий рій! Пасічницька майстерня плете традиційні вулики-кошики зі соломи для нового сезону, майстер переплітає джгути соломи по спіралі, як робили ще прадіди. Молодий пасічник спостерігає, записуючи послідовність рухів у блокнот. Раптом один з готових вуликів виявляється сплетеним з геть інакшою щільністю, ніж решта партії. Місто засинає.",
